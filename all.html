<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hatohatoscope — 作業フォルダ全体ビューア</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Meiryo", sans-serif; font-size: 16px; color: #1a1a1a; }
  .container { display: flex; height: 100vh; }
  /* 左の欄は縦に並べ、スクロールは中の2つ（ブックマーク欄とツリー）が別々に持つ
     （2026-09-27 本人指示。欄ぜんたいのスクロールと二重になって境目が見づらかった） */
  .menu {
    width: 520px; min-width: 150px; max-width: 1400px;
    overflow: hidden; padding: 8px 10px;
    background: #f7f7f7; flex: 0 0 auto;
    display: flex; flex-direction: column;
  }
  .menu > .menu-header { flex: 0 0 auto; }
  #tree { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  /* ドラッグで左メニュー幅を変える境界バー */
  .dragbar {
    flex: 0 0 6px; cursor: col-resize; background: #ccc;
  }
  .dragbar:hover, .dragbar.dragging { background: #1a4f8a; }
  /* 左メニューを隠した状態（メニュー本体と境界バーを消し、ビューアを全幅にする） */
  .menu.collapsed, .dragbar.collapsed { display: none; }
  /* ===== メニューの置き場所（左＝既定 / 下 / 別窓に切り離し） ===== */
  /* 下：ビューアを上・メニューを下に置く。横幅を一切食わない */
  .container.mode-bottom { flex-direction: column-reverse; }
  .container.mode-bottom .menu { width: auto !important; max-width: none; border-top: 1px solid #ddd; }
  .container.mode-bottom .dragbar { cursor: row-resize; }
  /* 切り離し中：メニュー本体は別ウィンドウにあるので、境界バーを隠してビューアを全幅にする */
  .container.mode-detached .dragbar { display: none; }
  #toggleMenuBtn {
    flex: 0 0 auto; width: 28px; font-size: 14px; padding: 5px 0; cursor: pointer;
    background: #eee; border: 1px solid #bbb; border-radius: 3px; line-height: 1; text-align: center;
  }
  #toggleMenuBtn:hover { background: #1a4f8a; color: #fff; border-color: #1a4f8a; }
  .mode-btn {
    flex: 0 0 auto; font-size: 12px; padding: 5px 8px; cursor: pointer; line-height: 1.2;
    background: #eee; border: 1px solid #bbb; border-radius: 3px;
  }
  .mode-btn:hover { background: #1a4f8a; color: #fff; border-color: #1a4f8a; }
  .mode-btn.active { background: #1a4f8a; color: #fff; border-color: #1a4f8a; font-weight: bold; }
  /* z-index必須：ツリーの行が position:relative（ガイド線用）を持つため、
     指定が無いと後から描画される行の文字が固定ヘッダーを突き抜けて見える */
  .menu-header { position: sticky; top: 0; z-index: 10; background: #f7f7f7; padding-bottom: 8px; border-bottom: 1px solid #ddd; margin-bottom: 8px; }
  .menu-header .title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .menu-header .title { font-weight: bold; font-size: 15px; }
  #reloadBtn {
    flex: 0 0 auto; font-size: 12px; padding: 3px 10px; cursor: pointer;
    color: #fff; background: #2e7d32; border: 1px solid #2e7d32; border-radius: 3px; line-height: 1.3;
  }
  #reloadBtn:hover { background: #1b5e20; border-color: #1b5e20; }
  #reloadBtn:disabled { background: #9e9e9e; border-color: #9e9e9e; cursor: default; }
  .menu-header button { font-size: 14px; padding: 4px 8px; margin-right: 4px; cursor: pointer; }
  #searchInput { width: 100%; font-size: 15px; padding: 5px; margin-top: 6px; }
  /* 指定の階層より深い開きを一括で畳むボタン行 */
  .fold-row { font-size: 12px; color: #333; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .fold-btn { font-size: 12px; padding: 1px 9px; cursor: pointer; }
  .fold-btn:hover { background: #1a4f8a; color: #fff; border-color: #1a4f8a; }
  /* 本文検索（ファイル名検索とは別の専用欄。VS Codeの検索パネルに相当） */
  #grepInput { width: 100%; font-size: 15px; padding: 5px; margin-top: 6px; }
  .grep-panel { border: 1px solid #999; border-radius: 4px; margin-top: 6px; background: #fff; }
  .grep-head { display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: bold; padding: 5px 8px; background: #ebebeb; border-radius: 4px 4px 0 0; }
  #grepClose { cursor: pointer; padding: 0 4px; font-size: 15px; }
  #grepClose:hover { color: #c00; }
  .grep-list { max-height: 45vh; overflow-y: auto; }
  .grep-item { padding: 5px 8px; border-top: 1px solid #e0e0e0; cursor: pointer; }
  .grep-item:hover { background: #eef3fb; }
  .grep-item .gname { font-size: 14px; font-weight: bold; color: #0645ad; }
  .grep-item .gdir { font-size: 11.5px; color: #555; }
  .grep-item .gtext { font-size: 12.5px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* min-width:0 が無いと、長いファイル名の帯（#fileTitleName は nowrap）が縮まず、
     ページ全体に横スクロールが出る（2026-09-26 本人指示で修正） */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  /* 左メニューと本文の境目のつまみ（2026-11-03 本人指示。はとはとブログの「メニュー非表示」のつまみの形）。
     本文の左の端に、上下の真ん中で貼り付ける。本文の左の端は、メニューを開いていれば境目、閉じていれば画面の左の端になる */
  .menu-tab { position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 40;
    writing-mode: vertical-rl; padding: 12px 4px; font-family: inherit; font-size: 13px; letter-spacing: 2px;
    color: #fff; background: #1a4f8a; border: none; border-radius: 0 6px 6px 0;
    box-shadow: 1px 1px 4px rgba(0,0,0,.25); cursor: pointer; opacity: .85; }
  .menu-tab:hover { opacity: 1; background: #123a66; }
  /* メニューを下や別窓に出しているとき、最大化しているときは出さない */
  .container.mode-bottom .menu-tab, .container.mode-detached .menu-tab, body.maximized .menu-tab { display: none; }
  /* flex-wrap:wrap が無いと、窓を狭めた時や左メニューを広げた時に、
     ボタンの並びが縮まずページ全体に横スクロールが出る（2026-09-26 修正） */
  .url-bar { display: flex; flex-wrap: wrap; align-items: center; padding: 6px; border-bottom: 1px solid #ccc; background: #fafafa; gap: 6px; }
  .url-wrap { position: relative; flex: 1; display: flex; }
  #urlInput { flex: 1; font-size: 14px; padding: 5px 26px 5px 5px; min-width: 0; }
  /* 入力欄のクリア（×）。文字があるときだけ出す */
  #urlClearBtn {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; line-height: 17px; text-align: center;
    font-size: 14px; color: #888; background: #ececec; border: 1px solid #d5d5d5;
    border-radius: 50%; cursor: pointer; user-select: none; display: none;
  }
  #urlClearBtn:hover { background: #c00; color: #fff; border-color: #c00; }
  /* 入力履歴（ブラウザ標準の履歴はパス末尾が切れてファイル名が見えないため、自前で出す） */
  .url-history {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    background: #fff; border: 1px solid #bbb; border-top: none;
    max-height: min(680px, 75vh); overflow: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.18);
  }
  .uh-head { padding: 4px 8px; font-size: 12px; color: #777; background: #f2f2f2; border-bottom: 1px solid #e0e0e0; }
  .uh-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; cursor: pointer; }
  .uh-item:hover, .uh-item.sel { background: #d6e4f5; }
  .uh-icon { flex: 0 0 auto; }
  .uh-name { flex: 0 0 auto; font-size: 14px; font-weight: bold; color: #1a1a1a; white-space: nowrap; }
  .uh-dir { flex: 1 1 auto; font-size: 13px; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uh-del { flex: 0 0 auto; width: 18px; text-align: center; color: #999; border-radius: 3px; }
  .uh-del:hover { background: #c00; color: #fff; }
  #copyBtn { flex: 0 0 auto; width: 30px; font-size: 14px; padding: 4px 0; cursor: pointer; text-align: center; }
  #reopenBtn { flex: 0 0 auto; font-size: 12px; padding: 5px 8px; cursor: pointer; }
  #reopenBtn:hover { background: #1b5e20; color: #fff; border-color: #1b5e20; }
  #reopenBtn.done { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  #diffBtn { flex: 0 0 auto; font-size: 12px; padding: 5px 8px; cursor: pointer; }
  #diffBtn:hover { background: #1a4f8a; color: #fff; border-color: #1a4f8a; }
  #copyBtn.copied { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  /* 開いているファイル名の帯（パス欄の下に常時表示。どの拡張子でも出す） */
  /* 場所の階段のいちばん下の段にファイル名を入れる（2026-10-31 本人指示。前は1段目にファイル名だけの行があった） */
  /* 帯は本文で使わない薄いベージュにし、本文との境目に濃いめの線を引く（2026-10-31 本人指示。
     白い地が続いて、ボタンの列・帯・本文が混ざって見えたため。本文の見出しは水色なので、水色だと本文の一部に見える） */
  .file-title { display: flex; align-items: flex-start; gap: 10px; padding: 5px 10px;
    background: #f3eee4; border-bottom: 2px solid #c2b08c; overflow: hidden; }
  /* 目次と最大化のボタンは帯の右上に置く（2026-10-31 本人指示。前はファイル名の下の行にあった）。
     左の場所とファイル名は min-width:0 で縮め、ボタンの手前で「…」と切る */
  .file-title-main { flex: 1 1 auto; min-width: 0; }
  .file-title-btns { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; }
  /* ファイル名は、見てすぐ気づくように 22px の太字にした（2026-10-31 本人指示。前は 17px） */
  #fileTitleName { display: block; font-size: 22px; font-weight: bold; color: #1a1a1a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 頭の └ はフォルダの段と同じ大きさで出す。字下げは showFileTitle が段の深さから付ける */
  #fileTitleName.in-steps::before { content: '└ '; font-size: 17px; color: #555; }
  /* 場所は1階層1行の階段で出す（2026-10-03 本人指示。1行に詰めると、長いフォルダ名が続いたとき切れて読めない） */
  /* 字の大きさは 12px では読みにくかったため 15px にし（2026-10-04）、さらに 17px の太字にした（2026-10-31 本人指示） */
  #fileTitleDir { display: block; font-size: 17px; font-weight: bold; color: #555; line-height: 1.45; }
  #fileTitleDir .dir-step { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 各階層はリンク。押すとツリーでそのフォルダまで開く（2026-10-03 本人指示） */
  #fileTitleDir a.dir-link { color: #1a4f8a; text-decoration: underline; cursor: pointer; }
  #fileTitleDir a.dir-link:hover { background: #e8eefc; }
  /* 本文と目次を横に並べる箱（2026-09-19 変更。目次を重ねずに左へ置くため flex にした） */
  .viewer-area { flex: 1; position: relative; display: flex; min-height: 0; min-width: 0; }
  /* 本文の中を探す欄（2026-11-04 本人指示）。本文の右上に重ねる。本文のスクロールバーを隠さないよう、右を少し空ける */
  #findBar { position: absolute; top: 6px; right: 24px; z-index: 45; display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; background: #fff; border: 1px solid #999; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #findInput { width: 260px; font-size: 14px; padding: 3px 5px; }
  #findCount { min-width: 4em; font-size: 14px; text-align: center; font-variant-numeric: tabular-nums; }
  #findCount.none { color: #c00; font-weight: bold; }
  #findClose { cursor: pointer; padding: 0 5px; font-size: 16px; border-radius: 3px; }
  #findClose:hover { background: #c00; color: #fff; }
  /* 目次ペイン（開いたMarkdown/HTMLの見出し一覧）。order:-1 で本文より左に出す。
     重ねないので本文は残りの幅に収まる（DOMの位置は動かしていない） */
  #outlinePane { order: -1; flex: 0 0 240px; overflow: auto;
    background: #fafafa; border-right: 1px solid #ddd; padding: 8px; display: none; }
  .ol-head { font-size: 12px; color: #555; font-weight: bold; margin-bottom: 6px; }
  .ol-item { font-size: 13px; padding: 2px 4px; cursor: pointer; color: #1a4f8a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 3px; }
  .ol-item:hover { background: #dbe6f3; }
  .ol-l2 { padding-left: 16px; }
  .ol-l3 { padding-left: 30px; font-size: 12px; }
  #outlineBtn { flex: 0 0 auto; font-size: 12px; padding: 3px 8px; cursor: pointer; display: none; }
  #outlineBtn.on { background: #1a4f8a; color: #fff; border-color: #1a4f8a; }
  /* 最大化（2026-10-07 本人指示）。表示中のファイルだけを画面いっぱいに出す。
     左のメニュー・パス欄・ファイル名の帯・目次を隠し、右上の「元に戻す」か Esc で戻す */
  #maxBtn { font-size: 12px; padding: 3px 8px; cursor: pointer; }
  #restoreBtn { display: none; position: fixed; top: 8px; right: 14px; z-index: 10000;
    font-size: 14px; padding: 4px 12px; cursor: pointer; background: #fff; color: #000;
    border: 1px solid #999; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  #restoreBtn:hover { background: #e8eefc; }
  body.maximized .menu, body.maximized .dragbar, body.maximized .url-bar, body.maximized .bm-bar,
  body.maximized #fileTitle, body.maximized #outlinePane { display: none !important; }
  body.maximized #restoreBtn { display: block; }
  /* 本文側は残りの幅いっぱい。flex-basis:0 にして目次の有無で自動的に幅が決まるようにする */
  #viewer { flex: 1 1 0; min-width: 0; height: 100%; border: none; }
  .placeholder { flex: 1 1 0; min-width: 0; padding: 30px; color: #666; }
  #editor { flex: 1 1 0; min-width: 0; }
  /* PDF の簡易表示（pdf.js）。枠の幅いっぱいにページを縦に並べる（2026-09-19 追加） */
  #pdfPane { flex: 1 1 0; min-width: 0; overflow: auto; background: #6b6b6b; padding: 12px; }
  #pdfPane canvas { display: block; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,.45); }
  .pdf-msg { color: #fff; font-size: 13px; margin: 0 0 8px; }
  /* フォルダは「浮いた帯」にしてファイル（ただの行）と一目で区別する */
  .tree-folder-name {
    cursor: pointer; display: flex; align-items: center;
    padding: 3px 6px; margin: 2px 0;
    user-select: none; white-space: nowrap;
    background: #ebedf0; border: 1px solid #dcdfe3; border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    font-weight: 600;
  }
  .tree-folder-name:hover { background: #dbe6f3; border-color: #b6cbe4; }
  .tree-folder-icon { display: inline-block; width: 1.4em; flex: 0 0 auto; color: #555; }
  .tree-folder-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  /* 作業フォルダ直下のフォルダの行に、中のファイルの数を薄い棒と数字で出す（2026-11-01 本人指示。ヒートマップ）。
     棒の長さは対数の目盛り（1・10・100・1,000・10,000件が等間隔）で、一番多いフォルダを行の幅いっぱいにする。
     棒は z-index:-1 で、帯の地の色と文字の間に敷く。isolation で重なりを行の中に閉じる。
     棒の位置の基準にするため、行を relative にする */
  .tree-folder-name.has-count { isolation: isolate; position: relative; }
  .tree-count-bar { position: absolute; left: 0; top: 0; bottom: 0; z-index: -1; background: rgba(31, 111, 178, 0.18); border-radius: 3px; pointer-events: none; }
  .tree-count { flex: 0 0 auto; margin-left: 8px; font-weight: normal; color: #333; font-variant-numeric: tabular-nums; }
  .tree-folder-content {
    margin-left: 8px; padding-left: 12px;
    border-left: 1px solid #c4c4c4;   /* 階層の縦ガイド線 */
  }
  /* いま選んでいる行、またはマウスを乗せている行が入っているフォルダの縦線だけを目立たせる
     （2026-09-28 本人承認）。太さは 1px のままにして影で 2px 分に見せる。
     border-width を増やすと中身の位置が 1px ずれるため */
  .tree-folder-content.guide-on { border-left-color: #1a4f8a; box-shadow: -1px 0 0 #1a4f8a; }
  /* 縦線から各項目へ伸びる横線（階層を見やすく） */
  .tree-folder-content > .tree-folder,
  .tree-folder-content > .tree-file { position: relative; }
  .tree-folder-content > .tree-folder::before,
  .tree-folder-content > .tree-file::before {
    content: ''; position: absolute; left: -12px; top: 0.7em;
    width: 9px; height: 1px; background: #c4c4c4;
  }
  /* フォルダは帯の分だけ背が高いので、横のガイド線も中心に合わせ直す */
  .tree-folder-content > .tree-folder::before { top: 1em; }
  .tree-file { display: flex; align-items: center; }
  .tree-f-icon { flex: 0 0 auto; margin-right: 4px; font-size: 12px; }
  .tree-file a { flex: 1 1 auto; padding: 2px 0 2px 2px; color: #1a4f8a; text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-file a:hover { background: #e8e8e8; text-decoration: underline; }
  /* 選んでいるファイルの行は、蛍光ペンのような明るい黄色にする（2026-11-01 本人指示。前の薄い青は暗く見えたため） */
  .tree-file a.active { background: #fff59d; font-weight: bold; }
  .tree-file a.nonview { color: #777; cursor: default; }
  /* git状態の色つけ（VS Code風：変更=オレンジ・新規=緑） */
  .tree-file a.git-mod { color: #b45f06; }
  .tree-file a.git-new { color: #2e7d32; }
  .tree-folder-name.git-mod > .tree-folder-label { color: #b45f06; }
  .tree-folder-name.git-new > .tree-folder-label { color: #2e7d32; }
  .tree-c-copy { flex: 0 0 auto; width: 16px; height: 16px; margin-right: 6px; text-align: center; font-family: Consolas, monospace; font-size: 12px; line-height: 15px; color: #888; background: #ececec; border: 1px solid #d5d5d5; border-radius: 3px; cursor: pointer; user-select: none; }
  /* ブックマーク済みの行は c を黄色にして示す（2026-09-19 本人指定。上部の★ボタンの点灯色と同じ）。
     hover と copied（コピー直後の✓）は後ろに書いて、その間だけ優先させる */
  .tree-c-copy.bm-on { background: #f6b93b; color: #3a2e00; border-color: #d89b1c; }
  .tree-c-copy:hover { background: #1a4f8a; color: #fff; border-color: #1a4f8a; }
  .tree-c-copy.copied { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  /* 変更のある行に出る差分ボタン（±） */
  .tree-d-btn { flex: 0 0 auto; width: 16px; height: 16px; margin-right: 6px; text-align: center; font-family: Consolas, monospace; font-size: 12px; line-height: 15px; color: #b45f06; background: #fdf0e0; border: 1px solid #e8c9a0; border-radius: 3px; cursor: pointer; user-select: none; }
  .tree-d-btn:hover { background: #b45f06; color: #fff; border-color: #b45f06; }
  /* ===== ブックマークの帯（2026-11-03 本人指示。2026-11-04 本人指示でフォルダごとのボタンと一覧にした） =====
     パス欄のすぐ下に、ブックマークが入っている作業フォルダ直下のフォルダごとのボタンを並べ、帯の中で折り返して全部を出す。
     ボタンは名前を切らず、右に中のブックマークの数を出す。帯の幅を超える名前だけ「…」で切る。
     押すと一覧が開き、その中のブックマークを、ファイル名の帯の場所の階段と同じ形で、名前を切らずに全部出す。
     前は左のメニューの上に欄があり、ツリーの場所を狭めていた */
  .bm-bar { position: relative; display: flex; padding: 2px 6px; background: #fafafa; border-bottom: 1px solid #ccc; }
  .bm-bar-items { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
  .bm-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; max-width: 100%; box-sizing: border-box;
    padding: 2px 8px; border-radius: 12px; font-size: 14px; color: #1a1a1a; cursor: pointer;
    white-space: nowrap; user-select: none; }
  .bm-chip-name { overflow: hidden; text-overflow: ellipsis; }
  .bm-chip-count { flex: 0 0 auto; font-size: 12px; color: #555; font-variant-numeric: tabular-nums; }
  .bm-chip:hover, .bm-chip.open { background: #dbe6f3; }
  /* ボタンを押すと開く一覧。名前を切らないよう、幅は中身に合わせ、帯の幅を超える名前だけ折り返す */
  #bmList { position: absolute; z-index: 60; width: max-content; max-width: calc(100% - 8px); overflow: auto;
    padding: 4px; background: #fff; border: 1px solid #999; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .bm-row { display: flex; padding: 2px 10px 2px 8px; border-radius: 3px; font-size: 15px; line-height: 1.5; color: #1a1a1a; cursor: pointer; user-select: none; }
  .bm-row:hover { background: #dbe6f3; }
  .bm-row-mark { flex: 0 0 auto; white-space: pre; color: #555; }
  .bm-row-name { overflow-wrap: anywhere; }
  /* ブックマークに入っている行は、帯の階段のリンクと同じ色と下線にする。何も付けていない行は、途中のフォルダ */
  .bm-row.is-bm .bm-row-name { color: #1a4f8a; text-decoration: underline; }
  /* 場所が見つからないブックマーク（消したか、移したもの）。薄くし、名前に取り消し線を引く */
  .bm-dead { opacity: .55; }
  .bm-dead .bm-chip-name, .bm-row.is-bm.bm-dead .bm-row-name { text-decoration: line-through; }
  /* 左の絞り込み欄の下に出す「本文を検索」ボタン行 */
  .tree-grep { display: none; padding: 6px 8px; margin: 4px 0; border: 1px solid #bbb; border-radius: 4px;
    cursor: pointer; font-size: 13px; color: #000; background: #f7f7f7; }
  .tree-grep:hover { background: #e8eefc; }
  #bmBtn { flex: 0 0 auto; font-size: 14px; padding: 4px 7px; cursor: pointer; }
  #bmBtn.on { background: #f6b93b; border-color: #d89b1c; color: #3a2e00; }
  .tree-bm-star { flex: 0 0 auto; margin-right: 4px; color: #e8a11a; font-size: 12px; }
  /* ツリーとブックマーク欄の対応を示す印（2026-09-21 本人指示）。
     片方の行にマウスを乗せると、同じパスの行がもう片方でも光る。
     色は★と同じ黄系1色だけにする（色数を増やさない）。
     hover の指定より後ろに置いて、重なったときはこちらを優先させる */
  .tree-folder-name.xlink {
    background: #ffe3a0; border-color: #dfae37; box-shadow: 0 0 0 2px #f6b93b;
  }
  .tree-file.xlink {
    background: #ffe3a0; border-radius: 3px; box-shadow: 0 0 0 2px #f6b93b;
  }
  /* 帯のボタンと一覧の行も同じ色で光らせる。ツリーの行を押したときは、そのブックマークが入っているボタンを2秒だけ光らせる */
  .bm-chip.xlink, .bm-chip.bm-hit, .bm-row.xlink {
    background: #ffe3a0; box-shadow: 0 0 0 2px #f6b93b;
  }
  /* ===== 選んだ場所の階層（2026-10-31 本人指示。2026-11-03 本人指示で道筋だけにした） =====
     下のツリーで選んだものと、その上のフォルダだけを並べる。行の見た目は下のツリーの指定をそのまま使う */
  .top-box { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 6px; }
  .top-head { font-size: 13px; color: #333; font-weight: bold; margin-bottom: 4px;
    display: flex; flex-wrap: wrap; row-gap: 4px; align-items: center; justify-content: space-between; }
  /* メニューの幅が狭いときは、見出しの字を途中で折らずに、ボタンの組を次の行の右に回す */
  .top-up { font-weight: normal; margin-left: auto; }
  /* .menu-header button の指定より強くするため、.top-head を前に付ける */
  .top-head .top-up-btn { font-size: 12px; padding: 1px 8px; margin: 0 0 0 4px; cursor: pointer; }
  .top-head .top-up-btn:hover { background: #1a4f8a; color: #fff; border-color: #1a4f8a; }
  .top-head .top-up-btn.active { background: #1a4f8a; color: #fff; border-color: #1a4f8a; font-weight: bold; }
  /* 高さは並べた段の数に合わせる（2026-11-03。前は高さを決めて下端のつまみで変えていた）。段がとても多いときだけ欄の中で送る */
  #topTree { max-height: 45vh; overflow-y: auto; overflow-x: hidden; }
  .top-empty { font-size: 13px; color: #333; padding: 2px 4px; }
  /* 行にマウスを乗せたときの吹き出し（2026-09-27 本人指示）。
     ブラウザ標準の吹き出しは出るまで約1秒かかるため自前で出す。待ち時間なし。
     出すのは行までの階層を1階層1行にした階段（2026-10-18 本人指示。名前→絶対パス→階段と変更）。長い名前は折り返す */
  #hoverTip {
    position: fixed; z-index: 9998; display: none;
    max-width: 640px; padding: 5px 9px;
    background: #fff; color: #000; border: 1px solid #999; border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    font-size: 14px; line-height: 1.5; white-space: normal; word-break: break-all;
    pointer-events: none;
  }
  .loading { color: #999; padding: 10px; }
</style>
</head>
<body>
<div id="hoverTip"></div>
<button id="restoreBtn" title="元の画面に戻す（Esc）">元に戻す</button>
<div class="container">
  <nav class="menu">
    <div class="menu-header">
      <div class="title-row">
        <div class="title">作業フォルダ全体</div>
        <button id="reloadBtn" title="フォルダを再スキャンしてツリーを最新にする">更新</button>
      </div>
      <div class="fold-row">畳む:
        <button class="fold-btn" data-depth="1" title="第1階層だけ残して、それより深い開きを全部畳む">1</button>
        <button class="fold-btn" data-depth="2" title="第2階層まで残して、それより深い開きを畳む">2</button>
        <button class="fold-btn" data-depth="3" title="第3階層まで残して、それより深い開きを畳む">3</button>
      </div>
      <input type="text" id="searchInput" placeholder="ファイル名で絞り込み...">
      <input type="text" id="grepInput" placeholder="本文を検索（md・html）Enterで実行">
      <div class="grep-panel" id="grepPanel" style="display:none;">
        <div class="grep-head"><span id="grepHead"></span><span id="grepClose" title="結果を閉じる">×</span></div>
        <div class="grep-list" id="grepList"></div>
      </div>
      <div class="tree-grep" id="treeGrep" title="ファイルの中身から探す"></div>
      <!-- 上のツリー（2026-10-31 本人指示。下と同じ形のツリー。ブックマーク欄は 2026-11-03 にパス欄の下の帯へ移した） -->
      <div class="top-box" id="topBox">
        <div class="top-head">選んだ場所の階層<span class="top-up">上にそろえる:<button class="top-up-btn" data-up="1" title="押したものの1つ上のフォルダを、この欄の上の端にそろえる">1つ上</button><button class="top-up-btn" data-up="2" title="押したものの2つ上のフォルダを、この欄の上の端にそろえる">2つ上</button><button class="top-up-btn" data-up="3" title="押したものの3つ上のフォルダを、この欄の上の端にそろえる">3つ上</button><button class="top-up-btn" data-up="4" title="押したものの4つ上のフォルダを、この欄の上の端にそろえる">4つ上</button><button class="top-up-btn" data-up="all" title="作業フォルダの直下のフォルダを、この欄の上の端にそろえる（押したものまでの全部の階層が並ぶ）">一番上</button></span></div>
        <div id="topTree"><div class="loading">読込中...</div></div>
      </div>
    </div>
    <div id="tree"><div class="loading">読込中...</div></div>
  </nav>
  <div class="dragbar" id="dragbar" title="ドラッグで幅を変更"></div>
  <main class="content">
    <!-- 左メニューの開け閉めのつまみ（2026-11-03 本人指示） -->
    <button id="menuTab" class="menu-tab" title="左メニューを隠す（Ctrl+B）">メニュー非表示</button>
    <div class="url-bar">
      <button id="toggleMenuBtn" title="メニューを隠す / 表示する（Ctrl+B）">◀</button>
      <button id="modeBottomBtn" class="mode-btn" title="メニューを画面下に移す / 左に戻す（横幅を空ける）">下</button>
      <button id="modePopupBtn" class="mode-btn" title="メニューを別のウィンドウに切り離す / 戻す（操作パネルとして独立させる）">別窓</button>
      <div class="url-wrap">
        <input type="text" id="urlInput" autocomplete="off" spellcheck="false" placeholder="ファイル名で検索、またはファイル／フォルダの絶対パスを入力して Enter（↑↓で選択）">
        <span id="urlClearBtn" title="入力をクリア">×</span>
        <div id="urlHistory" class="url-history" style="display:none;"></div>
      </div>
      <button id="copyBtn" title="パスをコピー">📋</button>
      <button id="bmBtn" title="今のパスをブックマークに登録 / 解除">★</button>
      <button id="reopenBtn" title="開いているファイルだけ読み直す（裏で書き換わった内容を反映。ページ全体は再読込しないのでツリーや位置は消えない）">再表示</button>
      <button id="diffBtn" title="このパスのgit差分を色つき表示">差分</button>
      <button id="editBtn" style="display:none;">編集</button>
      <button id="saveBtn" style="display:none;">保存</button>
      <button id="cancelBtn" style="display:none;">キャンセル</button>
      <span id="saveMsg" style="margin-left:8px;font-size:13px;color:#178a3a;"></span>
    </div>
    <!-- ブックマークの帯（2026-11-03 本人指示。Chrome のブックマークバーの形） -->
    <div class="bm-bar" id="bmBar" style="display:none;">
      <div class="bm-bar-items" id="bmBarItems"></div>
      <div id="bmList" style="display:none;"></div>
    </div>
    <div class="file-title" id="fileTitle" style="display:none;">
      <div class="file-title-main"><span id="fileTitleDir"></span><span id="fileTitleName"></span></div>
      <div class="file-title-btns">
        <button id="outlineBtn" title="目次の表示 / 非表示">目次</button>
        <button id="maxBtn" title="表示中のファイルを画面いっぱいに広げる（右上の「元に戻す」か Esc で戻る）">最大化</button>
      </div>
    </div>
    <div class="viewer-area">
      <!-- 本文の中を探す欄（2026-11-04 本人指示。本文の上で右ボタンを0.5秒押し続けると開く） -->
      <div id="findBar" style="display:none;">
        <input type="text" id="findInput" autocomplete="off" spellcheck="false" placeholder="本文の中を探す" title="Enter で次へ、Shift+Enter で前へ、Esc で閉じる">
        <span id="findCount"></span>
        <span id="findClose" title="閉じる（Esc）">×</span>
      </div>
      <div class="placeholder" id="placeholder">メニューからファイルを選ぶと、ここに表示されます。</div>
      <iframe id="viewer" style="display:none;"></iframe>
      <div id="pdfPane" style="display:none;"></div>
      <div id="outlinePane"></div>
      <textarea id="editor" style="display:none;width:100%;height:100%;border:none;padding:12px;font-family:Consolas,monospace;font-size:14px;box-sizing:border-box;resize:none;"></textarea>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- PDF の簡易表示用（Chrome の「PDFをダウンロードする」設定がオンでも枠の中に描けるようにする。2026-09-19） -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function () {
  // この all.html は http://localhost/mydocs/all.html で開く想定。
  // 表示対象のルートはサーバー側（api/config.json）で決まる。フロントはパスを持たない。
  var API = 'api/file_tree?root=1';
  // 書き換えの依頼（保存・作成・名前の変更・ブックマーク・閲覧範囲）に付ける見出し。
  // サーバーはこれが無い依頼を断る（ほかのサイトのページから書き換えさせないため。2026-10-31）
  var VIEWER_HDR = { 'X-Hatohatoscope': '1' };

  // 画像（枠の幅に収めて表示する。2026-09-19 追加：.jpeg 等が灰色で開けなかったため）
  var IMG_EXT = ['.png','.jpg','.jpeg','.gif','.webp','.bmp','.ico'];
  var VIEW_EXT = ['.html','.htm','.md','.pdf','.php','.py','.js','.css','.json','.xml','.txt','.csv','.sql','.sh','.bat','.ps1','.yml','.yaml','.svg','.puml','.diff','.patch',
                  '.gitignore','.gitattributes','.editorconfig','.ini','.toml','.conf','.cfg','.log'].concat(IMG_EXT);
  var TEXT_EXT = ['.php','.py','.js','.css','.json','.xml','.txt','.csv','.sql','.sh','.bat','.ps1','.yml','.yaml',
                  '.gitignore','.gitattributes','.editorconfig','.ini','.toml','.conf','.cfg','.log'];

  // ===== ソースコードの色付け（highlight.js） =====
  // 色付けはプレビュー枠（iframe）の中だけで動く。ツリー・検索など本体側の動作には影響しない。
  // 大きいファイルは重くなるので色付けしない（そのまま素のテキストで出す）。
  // 2026-08-22 実測（1ファイルあたりの色付け時間）:
  //   3〜6KB=0.1〜0.2秒 / 25KB(json)=0.3秒 / 55KB(html)=1.2秒
  // 上限10万文字なら、遅くても2秒程度で収まる。超えるものは素のテキストにする。
  var HL_MAX_CHARS = 100000;
  var HL_LANG = {
    '.py':'python', '.js':'javascript', '.json':'json', '.php':'php', '.css':'css',
    '.xml':'xml', '.html':'xml', '.htm':'xml', '.svg':'xml', '.sql':'sql',
    '.sh':'bash', '.bat':'dos', '.ps1':'powershell', '.yml':'yaml', '.yaml':'yaml',
    '.ini':'ini', '.toml':'ini', '.conf':'ini', '.cfg':'ini',
    '.gitignore':'bash', '.gitattributes':'bash', '.editorconfig':'ini'
  };
  function hlLangOf(ext) { return HL_LANG[ext] || ''; }
  var HL_BASE = 'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11';
  // 標準バンドルに入っていない言語は、その言語のモジュールだけ追加で読む
  // （2026-08-22 実測：powershell と dos は含まれておらず、そのままでは色が付かない）
  var HL_EXTRA = ['powershell', 'dos'];
  function hlExtraTags(lang) {
    var list = lang ? (HL_EXTRA.indexOf(lang) >= 0 ? [lang] : []) : HL_EXTRA;
    return list.map(function (l) {
      return '<scr' + 'ipt src="' + HL_BASE + '/languages/' + l + '.min.js"></scr' + 'ipt>';
    }).join('');
  }

  var treeEl = document.getElementById('tree');
  // メニュー内の要素は「別窓へ切り離す」と document から消えるため、最初に掴んでおく
  // （getElementById で取り直すと切り離し中に null になり、更新や絞り込みが壊れる）
  var menuEl = document.querySelector('.menu');
  var reloadBtnEl = document.getElementById('reloadBtn');
  var searchInputEl = document.getElementById('searchInput');
  var bmBarEl = document.getElementById('bmBar');
  var bmBarItemsEl = document.getElementById('bmBarItems');
  var bmListEl = document.getElementById('bmList');
  var topTreeEl = document.getElementById('topTree');   // 上のツリー（2026-10-31 追加）
  var iframe = document.getElementById('viewer');
  var placeholder = document.getElementById('placeholder');
  var urlInput = document.getElementById('urlInput');
  var editor = document.getElementById('editor');
  var currentWin = '';
  var EDIT_EXT = ['.md','.txt','.json','.py','.php','.js','.css','.html','.htm','.xml','.csv','.yml','.yaml','.sql','.sh','.bat','.puml','.ini',
                  '.gitignore','.env'];
  var STORAGE = 'allViewerOpenFolders';
  var currentMenuMode = 'left';   // 'left' | 'bottom' | 'popup'（下の表示モードIIFEが設定する）
  // ブックマークは 2026-10-31 に止め、2026-11-01 に戻した（本人指示「やっぱりブックマークがないと分かりづらい」）。
  // 2026-11-03 から、パス欄の下の帯に出す（本人指示。前は左のメニューの上の欄）。止めるときはここを false にする
  // （帯・上部の★ボタン・右クリックの登録・行頭の c の黄色が消える。登録済みの一覧 api/bookmarks.json は残る）
  var BM_ENABLED = true;

  function getOpen() { try { return JSON.parse(localStorage.getItem(STORAGE)) || []; } catch (e) { return []; } }
  function setOpen(a) { try { localStorage.setItem(STORAGE, JSON.stringify(a)); } catch (e) {} }
  function addOpen(p) { var a = getOpen(); if (a.indexOf(p) < 0) { a.push(p); setOpen(a); } }
  function rmOpen(p) { setOpen(getOpen().filter(function (x) { return x !== p; })); }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function extOf(n) { var i = n.lastIndexOf('.'); return i < 0 ? '' : n.substring(i).toLowerCase(); }

  // クリップボードコピー（localhost以外/file:でも動くようフォールバック付き）
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = document.execCommand('copy'); document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('execCommand failed'));
      } catch (e) { reject(e); }
    });
  }

  // Windowsフルパス → serve 経由のURL。
  // サーバー（server.py）がディスクから直接読むので、公開フォルダの制約を受けない。
  function toUrl(winPath) {
    return 'serve?p=' + encodeURIComponent(winPath);
  }

  function iconOf(name, isDir) {
    if (isDir) return '📁';
    var m = { '.md':'📝', '.html':'🌐', '.htm':'🌐', '.pdf':'📕', '.php':'🐘',
      '.py':'🐍', '.js':'📜', '.css':'🎨', '.json':'🗂️', '.txt':'📃',
      '.csv':'📊', '.svg':'🖼️', '.puml':'📐', '.png':'🖼️', '.jpg':'🖼️', '.jpeg':'🖼️', '.gif':'🖼️' };
    return m[extOf(name)] || '📄';
  }

  // 作業フォルダ直下の各フォルダの中のファイル数（パスの小文字 → 件数）と、その一番大きい値（2026-11-01 本人指示。ヒートマップ）。
  // renderTree が数え、folderRowHtml が行に薄い棒と数字で出す。数えるのはツリーに出ているファイルだけ（深さ6まで、.git などは除く）
  var topCounts = {}, topCountMax = 0;
  function countFiles(node) {
    var n = 0;
    (node.children || []).forEach(function (c) { n += c.children ? countFiles(c) : 1; });
    return n;
  }
  // 棒の長さ（%）。対数の目盛りにする。01_myrepo だけが3万件を超え、件数の比のままでは
  // ほかのほとんどの棒が幅の2%に届かず見えないため。一番多いフォルダが 100%、0件は棒なし
  function countBarWidth(n) {
    if (!n || topCountMax < 1) return 0;
    return Math.round(Math.log10(n + 1) / Math.log10(topCountMax + 1) * 1000) / 10;
  }

  // ツリーの1行の形。下のツリーと上のツリー（2026-10-31 追加）で同じものを使い、見た目をそろえる
  function folderRowHtml(it, isOpen) {
    var n = topCounts[it.path.toLowerCase()];
    var has = n !== undefined;
    return '<span class="tree-folder-name' + (has ? ' has-count' : '') + '" data-path="' + esc(it.path) + '" data-open="' + isOpen + '">'
      + (has ? '<span class="tree-count-bar" style="width:' + countBarWidth(n) + '%;"></span>' : '')
      + '<span class="tree-c-copy" data-path="' + esc(it.path) + '" title="パスをコピー">c</span>'
      + '<span class="tree-folder-label">' + esc(it.name) + '</span>'
      + (has ? '<span class="tree-count">' + n.toLocaleString('ja-JP') + '</span>' : '')
      + '</span>';
  }
  function fileRowHtml(it) {
    // 拡張子なし（LICENSE・Makefile等）もテキストとして開けるようにする
    var fext = extOf(it.name);
    var viewable = VIEW_EXT.indexOf(fext) >= 0 || fext === '';
    var html = '<div class="tree-file">';
    html += '<span class="tree-c-copy" data-path="' + esc(it.path) + '" title="パスをコピー">c</span>';
    // .md と .html だけアイコンで区別する（本人指定。他の拡張子は付けない）
    if (fext === '.md') { html += '<span class="tree-f-icon">📝</span>'; }
    else if (fext === '.html' || fext === '.htm') { html += '<span class="tree-f-icon">🌐</span>'; }
    if (viewable) {
      html += '<a class="viewlink" data-win="' + esc(it.path) + '">' + esc(it.name) + '</a>';
    } else {
      html += '<a class="nonview">' + esc(it.name) + '</a>';
    }
    return html + '</div>';
  }

  function render(items, depth) {
    var html = '';
    var open = getOpen();
    items.forEach(function (it) {
      if (it.children) {
        var isOpen = open.indexOf(it.path) >= 0;
        html += '<div class="tree-folder">' + folderRowHtml(it, isOpen);
        html += '<div class="tree-folder-content" style="display:' + (isOpen ? 'block' : 'none') + ';">';
        html += render(it.children, depth + 1);
        html += '</div></div>';
      } else {
        html += fileRowHtml(it);
      }
    });
    return html;
  }

  // 巨大ツリーでも固まらないよう、各ノードに個別付与せず treeEl 1つに委譲する。
  // （従来は数万ノードに addEventListener していたため、ここで固まっていた。）
  // 行頭の c（パスコピー）を押したときの動き。ツリーとブックマーク欄で共通にする（2026-09-27）
  function runCopyBtn(copy) {
    copyText(copy.dataset.path).then(function () {
      copy.classList.add('copied'); copy.textContent = '✓';
      setTimeout(function () { copy.classList.remove('copied'); copy.textContent = 'c'; }, 1000);
    }).catch(function () {
      copy.classList.add('copied'); copy.textContent = '!';
      setTimeout(function () { copy.classList.remove('copied'); copy.textContent = 'c'; }, 1000);
    });
  }
  // たどるべき縦線を1本だけ明るくする（2026-09-28 本人承認）。
  // マウスを乗せている行を優先し、乗せていないときは選んでいる行を基準にする
  var guideHoverRow = null;
  function updateTreeGuide() {
    var prev = treeEl.querySelectorAll('.tree-folder-content.guide-on');
    for (var i = 0; i < prev.length; i++) prev[i].classList.remove('guide-on');
    var row = guideHoverRow || treeEl.querySelector('a.viewlink.active');
    if (!row || !row.closest) return;
    var box = row.closest('.tree-folder-content');
    if (box) box.classList.add('guide-on');
  }
  treeEl.addEventListener('mouseover', function (e) {
    var r = e.target.closest ? e.target.closest('.tree-file, .tree-folder-name') : null;
    if (r === guideHoverRow) return;
    guideHoverRow = r;
    updateTreeGuide();
  });
  treeEl.addEventListener('mouseleave', function () { guideHoverRow = null; updateTreeGuide(); });
  function onTreeClick(e) {
    // 押した行と同じパスのブックマーク行を、ブックマーク欄の一番上へ寄せる（2026-09-22 本人指示）
    revealBmRow(treeHoverPath(e.target));
    // 差分ボタン（±）：そのファイル／フォルダだけの差分を表示
    var d = e.target.closest('.tree-d-btn');
    if (d) { e.stopPropagation(); showDiff(d.dataset.path); return; }
    // パスコピー（フォルダ・ファイル共通）。開閉やファイル表示には伝播させない。
    var copy = e.target.closest('.tree-c-copy');
    if (copy) { e.stopPropagation(); runCopyBtn(copy); return; }
    // ファイル表示
    var link = e.target.closest('a.viewlink');
    if (link) {
      treeEl.querySelectorAll('a.viewlink.active').forEach(function (x) { x.classList.remove('active'); });
      link.classList.add('active');
      openFile(link.dataset.win);
      syncTopTree(link.dataset.win, { force: true });   // 同じファイルをもう一度押したときも、選んだ場所の階層を描き直す
      return;
    }
    // フォルダ開閉
    var f = e.target.closest('.tree-folder-name');
    if (f) {
      var isOpen = f.dataset.open === 'true';
      f.dataset.open = isOpen ? 'false' : 'true';
      var c = f.nextElementSibling;
      if (c) c.style.display = isOpen ? 'none' : 'block';
      if (isOpen) rmOpen(f.dataset.path); else addOpen(f.dataset.path);
      // 選んだ場所の階層は動かさない（2026-11-03 本人指示。階層はいつも本文で開いているファイルの道筋にする）
      return;
    }
  }
  treeEl.addEventListener('click', onTreeClick);  // 1回だけ登録（reloadでも重複しない）

  // ===== ツリーの右クリックメニュー（2026-09-20。以前は右クリック即ブックマーク切替だった） =====
  // メニューを1枚挟むことで「間違えて右クリックした」だけでは何も起きない（外側クリック・Escで消える）。
  // メニューはツリーと同じ文書に作る（メニューを別窓へ切り離しているときも同じ窓に出すため）。
  // 見た目は CSS クラスに頼らず inline で書く（切り離し先の窓にこのページのCSSが無くても崩れない）
  var ctxCleanup = null;
  function closeCtxMenu() {
    if (ctxCleanup) { ctxCleanup(); ctxCleanup = null; }
  }
  function showCtxMenu(doc, x, y, items) {
    closeCtxMenu();
    var box = doc.createElement('div');
    box.style.cssText = 'position:fixed;z-index:9999;background:#fff;border:1px solid #999;border-radius:4px;'
      + 'box-shadow:0 2px 8px rgba(0,0,0,.25);padding:4px 0;font-size:13px;min-width:200px;color:#000;';
    box.addEventListener('mousedown', function (ev) { ev.stopPropagation(); });   // 外側クリック判定に拾わせない
    items.forEach(function (it) {
      var row = doc.createElement('div');
      row.textContent = it.label;
      row.style.cssText = 'padding:6px 14px;cursor:pointer;white-space:nowrap;';
      row.addEventListener('mouseenter', function () { row.style.background = '#e8eefc'; });
      row.addEventListener('mouseleave', function () { row.style.background = ''; });
      row.addEventListener('click', function () { closeCtxMenu(); it.run(); });
      box.appendChild(row);
    });
    doc.body.appendChild(box);
    // 画面からはみ出さないよう内側へ寄せる
    var vw = doc.documentElement.clientWidth, vh = doc.documentElement.clientHeight;
    box.style.left = Math.max(2, Math.min(x, vw - box.offsetWidth - 4)) + 'px';
    box.style.top = Math.max(2, Math.min(y, vh - box.offsetHeight - 4)) + 'px';
    function onKey(ev) { if (ev.key === 'Escape') closeCtxMenu(); }
    function onDown() { closeCtxMenu(); }
    setTimeout(function () {
      doc.addEventListener('mousedown', onDown);
      doc.addEventListener('keydown', onKey);
    }, 0);
    ctxCleanup = function () {
      doc.removeEventListener('mousedown', onDown);
      doc.removeEventListener('keydown', onKey);
      if (box.parentNode) box.parentNode.removeChild(box);
    };
  }
  // 上のメッセージ欄に短く出す（ブックマーク欄やツリーが画面外でも結果が分かるように）
  function flashMsg(text, color) {
    var msg = document.getElementById('saveMsg');
    if (!msg) return;
    msg.style.color = color || '#178a3a';
    msg.textContent = text;
    setTimeout(function () { if (msg.textContent === text) msg.textContent = ''; }, 3000);
  }
  // 「ここにフォルダを作る」。作れるのは作業フォルダの中だけ・1階層だけ（サーバー側でも同じ検査をする）
  function makeFolder(parent) {
    var name = window.prompt('「' + baseName(parent) + '」の中に作るフォルダの名前を入れてください', '');
    if (name === null) return;            // キャンセル
    name = name.trim();
    if (!name) { flashMsg('フォルダ名が空です', '#c00'); return; }
    var body = new URLSearchParams();
    body.append('p', parent);
    body.append('name', name);
    fetch('mkdir', { method: 'POST', headers: VIEWER_HDR, body: body })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, t: t }; }); })
      .then(function (res) {
        if (!res.ok) { flashMsg(res.t, '#c00'); return; }
        flashMsg(res.t);
        // 作ったフォルダをツリーに出して、開いた状態で一番上へ
        var created = parent.replace(/[\\\/]+$/, '') + String.fromCharCode(92) + name;
        refreshTree(function () { revealFolderInTree(created); });
      })
      .catch(function () { flashMsg('フォルダを作れませんでした', '#c00'); });
  }
  // 「ここにファイルを作る」。中身は空で作る。拡張子が無ければ .md を付ける（2026-09-27 追加）
  function makeFile(parent) {
    var name = window.prompt('「' + baseName(parent) + '」の中に作るファイルの名前を入れてください（拡張子が無ければ .md を付けます）', '');
    if (name === null) return;
    name = name.trim();
    if (!name) { flashMsg('ファイル名が空です', '#c00'); return; }
    if (name.indexOf('.') < 0) name += '.md';
    var body = new URLSearchParams();
    body.append('p', parent);
    body.append('name', name);
    fetch('newfile', { method: 'POST', headers: VIEWER_HDR, body: body })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, t: t }; }); })
      .then(function (res) {
        if (!res.ok) { flashMsg(res.t, '#c00'); return; }
        flashMsg(res.t);
        var created = parent.replace(/[\\\/]+$/, '') + String.fromCharCode(92) + name;
        refreshTree(function () { openFile(created); revealInTree(created); });   // 作ってすぐ開く
      })
      .catch(function () { flashMsg('ファイルを作れませんでした', '#c00'); });
  }
  // ブックマークに入っているものの名前が変わったら、登録も付け替える（そのままだと開けなくなる）
  function fixBmPath(oldP, newP) {
    var sep = String.fromCharCode(92), lo = oldP.toLowerCase();
    function hits(b) { var lb = String(b.path).toLowerCase(); return lb === lo || lb.indexOf(lo + sep) === 0; }
    if (!getBm().some(hits)) return;
    changeBm(function (a) {
      return a.map(function (b) {
        if (!hits(b)) return b;
        var path = newP + String(b.path).substring(oldP.length);
        return { path: path, name: baseName(path), dir: !!b.dir };
      });
    });
  }
  // 「名前を変える」。同じ場所のまま名前だけ変える（2026-09-27 追加）
  function renamePath(target, isFolder) {
    var oldName = baseName(target);
    var name = window.prompt((isFolder ? 'フォルダ' : 'ファイル') + 'の新しい名前を入れてください', oldName);
    if (name === null) return;
    name = name.trim();
    if (!name || name === oldName) return;
    var body = new URLSearchParams();
    body.append('p', target);
    body.append('name', name);
    fetch('rename', { method: 'POST', headers: VIEWER_HDR, body: body })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, t: t }; }); })
      .then(function (res) {
        if (!res.ok) { flashMsg(res.t, '#c00'); return; }
        flashMsg(res.t);
        var moved = dirName(target) + String.fromCharCode(92) + name;
        var wasOpen = currentWin && currentWin.toLowerCase() === target.toLowerCase();
        fixBmPath(target, moved);
        refreshTree(function () {
          if (isFolder) { revealFolderInTree(moved); }
          else { if (wasOpen) openFile(moved); revealInTree(moved); }
        });
      })
      .catch(function () { flashMsg('名前を変えられませんでした', '#c00'); });
  }
  // 「閲覧範囲から外す」。パス欄から足したフォルダの行だけに出す。フォルダの中身には触らない（2026-10-31 追加）
  function removeRoot(p) {
    var body = new URLSearchParams();
    body.append('p', p);
    fetch('api/remove_root', { method: 'POST', headers: VIEWER_HDR, body: body })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, t: t }; }); })
      .then(function (res) {
        if (!res.ok) { flashMsg(res.t, '#c00'); return; }
        flashMsg(res.t);
        refreshTree();
      })
      .catch(function () { flashMsg('閲覧範囲から外せませんでした', '#c00'); });
  }
  // 作業フォルダの中か。外（.claude や、パス欄から足したフォルダ）は読み取り専用なので、作成と名前の変更を出さない
  function inWorkspace(p) {
    var root = (treeRootPath || '').replace(/[\\\/]+$/, '').toLowerCase();
    var lp = String(p).toLowerCase();
    return !!root && (lp === root || lp.indexOf(root + String.fromCharCode(92)) === 0);
  }
  // 下のツリーと上のツリーで同じメニューを出す
  function onTreeContextMenu(e) {
    var row = e.target.closest('.tree-file, .tree-folder-name');
    if (!row) return;
    var c = row.querySelector('.tree-c-copy');
    var p = c ? c.dataset.path : (row.dataset.path || '');
    if (!p) return;
    var isFolder = row.classList.contains('tree-folder-name');
    var items = [];
    if (BM_ENABLED) items.push({
      label: (isBm(p) ? '★ ブックマークから外す' : '★ ブックマークに登録') + '：' + baseName(p),
      run: function () {
        var wasOn = isBm(p);
        toggleBm(p);
        flashMsg((wasOn ? '★ ブックマークから外しました: ' : '★ ブックマークに登録しました: ') + baseName(p));
      }
    });
    if (inWorkspace(p)) {
      if (isFolder) {
        items.push({ label: '📁 ここにフォルダを作る', run: function () { makeFolder(p); } });
        items.push({ label: '📄 ここにファイルを作る', run: function () { makeFile(p); } });
      }
      items.push({ label: '✏ 名前を変える：' + baseName(p), run: function () { renamePath(p, isFolder); } });
    }
    if (isFolder && addedRoots[p.toLowerCase()]) {
      items.push({ label: '↩ 閲覧範囲から外す：' + baseName(p), run: function () { removeRoot(p); } });
    }
    if (!items.length) return;   // 出すものが無い行は、ブラウザの右クリックメニューのままにする
    e.preventDefault();   // 行の上ではブラウザの右クリックメニューを出さない
    showCtxMenu(row.ownerDocument, e.clientX, e.clientY, items);
  }
  treeEl.addEventListener('contextmenu', onTreeContextMenu);

  // 場所を1階層1行の階段で出す。2階層目からは頭に └ を付け、1段ごとに字下げを深くする
  // 各階層はリンクにし、押した先の絶対パスを data-path に持たせる（2026-10-03 本人指示）
  // 戻り値は出した段の数。ファイル名をその下の段に置くために使う（2026-10-31 追加）
  function renderDirSteps(box, winPath) {
    var rel = String(bmRelDir(winPath) || '');
    box.textContent = '';
    box.title = rel;   // 字が切れたときも、マウスを乗せれば全体が読める
    var dir = dirName(winPath);
    var root = (treeRootPath || '').replace(/[\\/]+$/, '');
    if (root && dir.toLowerCase() === root.toLowerCase()) {   // 作業フォルダの直下は、押す先の階層が無いので文字だけ出す
      var only = document.createElement('div');
      only.className = 'dir-step';
      only.textContent = rel;
      box.appendChild(only);
      return 1;
    }
    var parts = rel.split(/[\\\/]+/).filter(function (s) { return s; });
    var absParts = dir.split(/[\\\/]+/).filter(function (s) { return s; });
    var unc = /^[\\\/]{2}/.test(dir) ? '\\\\' : '';
    var skip = absParts.length - parts.length;   // 作業フォルダまでの手前の段数（作業フォルダの外なら 0）
    parts.forEach(function (name, i) {
      var line = document.createElement('div');
      line.className = 'dir-step';
      line.style.paddingLeft = (Math.max(0, i - 1) * 1.3) + 'em';
      if (i > 0) line.appendChild(document.createTextNode('└ '));
      var a = document.createElement('a');
      a.className = 'dir-link';
      a.textContent = name;
      a.dataset.path = unc + absParts.slice(0, skip + i + 1).join('\\');
      line.appendChild(a);
      box.appendChild(line);
    });
    return parts.length;
  }
  // 階層のリンクを押したら、ツリーでそのフォルダまで開く。ツリーにまだ無ければ再スキャンしてから開く
  var fileTitleDirEl = document.getElementById('fileTitleDir');
  if (fileTitleDirEl) fileTitleDirEl.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a.dir-link') : null;
    if (!a || !a.dataset.path) return;
    e.preventDefault();
    var p = a.dataset.path;
    if (revealFolderInTree(p)) return;
    flashMsg('フォルダをスキャン中...', '#888');
    refreshTree(function () {
      if (!revealFolderInTree(p)) flashMsg('ツリーにこのフォルダが見つかりません（除外対象の可能性）', '#c00');
    });
  });

  // ビューア上部に、場所の階段と、そのいちばん下の段のファイル名を出す（場所は作業フォルダ以降）
  var titlePath = '';   // 帯に出しているファイルのパス。ツリーを読み込み終えたときに階段を描き直すために覚える
  var titlePrefix = ''; // 帯のファイル名の頭書き（差分の表示なら「差分: 」）
  function showFileTitle(winPath, prefix) {
    var box = document.getElementById('fileTitle');
    if (!box) return;
    titlePath = winPath;
    titlePrefix = prefix || '';
    document.getElementById('fileTitleName').textContent = (prefix || '') + baseName(winPath);
    layoutFileTitle(winPath);
    box.style.display = 'flex';   // 左に場所とファイル名、右上にボタンを並べる（2026-10-31 変更）
  }
  // 場所の階段を描き、ファイル名の段の字下げをそろえる。ファイル名の文字（差分の頭書きを含む）は変えない。
  // 左メニューを開いている間は階段を出さない（2026-11-04 本人指示。左の「選んだ場所の階層」と同じ道筋が2か所に重なるため）。
  // メニューを下や別窓に出しているときも、階層は画面に出ているので同じにする。開け閉めしたら、左メニューの apply からここを呼び直す
  function layoutFileTitle(winPath) {
    var nameEl = document.getElementById('fileTitleName');
    var dirEl = document.getElementById('fileTitleDir');
    if (!menuEl.classList.contains('collapsed')) {
      dirEl.textContent = '';
      dirEl.title = '';
      nameEl.classList.remove('in-steps');
      nameEl.style.paddingLeft = '';
      return;
    }
    var depth = renderDirSteps(dirEl, winPath);
    // ファイル名の段の字下げは、フォルダの段と同じ「1段 1.3 文字」。フォルダの段の字の大きさで測ってそろえる
    var stepPx = parseFloat(getComputedStyle(dirEl).fontSize) || 17;
    nameEl.classList.toggle('in-steps', depth > 0);
    nameEl.style.paddingLeft = (Math.max(0, depth - 1) * 1.3 * stepPx) + 'px';
  }

  // srcdoc で出す文書に、どのファイルのものかの印を埋める（2026-10-31 追加）。
  // 「戻る」で前の文書に戻ったとき、帯・パス欄・ツリーをその文書に合わせるのに使う（shownDocOf）
  function markDoc(html, winPath, prefix) {
    var tag = '<meta name="hhscope-path" content="' + esc(winPath) + '">'
      + (prefix ? '<meta name="hhscope-prefix" content="' + esc(prefix) + '">' : '');
    var i = html.indexOf('<head>');
    return i >= 0 ? html.slice(0, i + 6) + tag + html.slice(i + 6) : tag + html;
  }

  function openFile(winPath) {
    showFileTitle(winPath);
    urlInput.value = winPath;
    updateClearBtn();
    updateBmBtn();
    addHistory(winPath);
    currentWin = winPath;
    // 選んだ場所の階層は、いつも本文で開いているファイルの道筋にする（2026-11-03 本人指示）。ツリーに出ないファイルも、パスから道筋を作る
    syncTopTree(winPath);
    watchGone = '';   // 開き直したので、閲覧範囲から外していたファイルでも、自動の読み直しの確かめを再開する
    var url = toUrl(winPath);
    var ext = extOf(winPath);
    placeholder.style.display = 'none';
    // 編集モードを解除して閲覧に戻す
    exitEdit();
    iframe.style.display = 'block';
    hidePdfPane();   // 直前がPDFの簡易表示なら消す（描画途中なら捨てる）
    // 編集可能な拡張子なら「編集」ボタンを出す
    document.getElementById('editBtn').style.display = (EDIT_EXT.indexOf(ext) >= 0) ? '' : 'none';

    // このビューア自身（mydocs\all.html）は iframe に読み込むとビューアが入れ子になり、
    // 親子で同じ localStorage（履歴・メニュー幅・開いたフォルダ）を取り合って表示が乱れる。
    // そのため入れ子にせず、ソースをテキスト表示する（「編集」ボタンはそのまま使える）。
    if (isSelfViewer(winPath)) {
      fetch(url + '&t=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
        iframe.removeAttribute('src');
        iframe.srcdoc = markDoc(textHtml(t, 'このファイルはこのビューア自身（all.html）です。入れ子表示を避けるため、ソースを表示しています。', 'xml'), winPath);
      }).catch(function () { iframe.srcdoc = markDoc(errHtml('ファイル読込エラー'), winPath); });
      return;
    }
    if (ext === '.pdf') {
      // ブラウザ内蔵のPDF表示が使えるならそれに任せる（検索・印刷ができる）。
      // Chrome の「PDFをダウンロードする」設定がオンだと内蔵表示が動かずダウンロード→Adobe等に飛ぶので、
      // その場合は pdf.js で枠の中に描く（2026-09-19 本人指定「Adobeではなく簡易的に中に表示」）
      if (navigator.pdfViewerEnabled !== false || !window.pdfjsLib) {
        iframe.removeAttribute('srcdoc');
        iframe.src = url + '&t=' + Date.now();
        return;
      }
      showPdfInline(url + '&t=' + Date.now());
      return;
    }
    if (ext === '.html' || ext === '.htm') {
      iframe.removeAttribute('srcdoc');
      iframe.src = url + '&t=' + Date.now();
      return;
    }
    if (ext === '.md') {
      fetch(url + '&t=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
        iframe.removeAttribute('src');
        iframe.srcdoc = markDoc(mdHtml(addHeadingIds(marked.parse(stripFrontmatter(t))), dirName(winPath)), winPath);
      }).catch(function () { iframe.srcdoc = markDoc(errHtml('MD読込エラー'), winPath); });
      return;
    }
    if (ext === '.diff' || ext === '.patch') {
      fetch(url + '&t=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
        iframe.removeAttribute('src');
        iframe.srcdoc = markDoc(diffHtml(t), winPath);
      }).catch(function () { iframe.srcdoc = markDoc(errHtml('差分の読込エラー'), winPath); });
      return;
    }
    if (ext === '.svg') {
      iframe.removeAttribute('srcdoc'); iframe.src = url + '&t=' + Date.now(); return;
    }
    if (ext === '.puml') {
      // まずローカルの plantuml.jar でその場描画（api/puml・キャッシュ付き 2026-08-29）。
      // jar が無い環境では従来どおり：同じ場所の _svg\<名前>.svg → 無ければソース表示
      var svgWin = winPath.replace(/\\([^\\]+)\.puml$/i, '\\_svg\\$1.svg');
      function pumlShow(svg) {
        iframe.removeAttribute('src');
        iframe.srcdoc = markDoc('<html><head><meta charset="UTF-8"></head>'
          + '<body style="margin:0;padding:12px;background:#fff;">' + svg + '</body></html>', winPath);
      }
      function pumlFallback() {
        return fetch(toUrl(svgWin) + '&t=' + Date.now()).then(function (r) {
          return r.ok ? r.text() : null;
        }).then(function (svg) {
          if (svg) { pumlShow(svg); return; }
          return fetch(toUrl(winPath) + '&t=' + Date.now()).then(function (r2) { return r2.text(); }).then(function (t) {
            iframe.srcdoc = markDoc(textHtml(t, '図の生成に失敗したため、PlantUML のソースを表示しています。', ''), winPath);
          });
        });
      }
      fetch('api/puml?p=' + encodeURIComponent(winPath) + '&t=' + Date.now()).then(function (r0) {
        return r0.ok ? r0.text() : null;
      }).then(function (svg0) {
        if (svg0) { pumlShow(svg0); return; }
        return pumlFallback();
      }).catch(function () { pumlFallback(); });
      return;
    }
    if (IMG_EXT.indexOf(ext) >= 0) {
      // 画像は枠の幅に収めて表示する（生のまま出すと原寸で横にはみ出す）。
      // srcdoc は親ページと同じ基点なので、相対URLの serve でそのまま届く
      iframe.removeAttribute('src');
      iframe.srcdoc = markDoc('<html><head><meta charset="UTF-8"></head>'
        + '<body style="margin:0;padding:10px;background:#6b6b6b;text-align:center">'
        + '<img src="' + esc(url + '&t=' + Date.now()) + '" style="max-width:100%;height:auto;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45)">'
        + '</body></html>', winPath);
      return;
    }
    if (TEXT_EXT.indexOf(ext) >= 0 || ext === '') {
      fetch(url + '&t=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
        iframe.removeAttribute('src');
        iframe.srcdoc = markDoc(textHtml(t, '', hlLangOf(ext)), winPath);
      }).catch(function () { iframe.srcdoc = markDoc(errHtml('ファイル読込エラー'), winPath); });
      return;
    }
    iframe.removeAttribute('srcdoc'); iframe.src = url + '&t=' + Date.now();
  }

  // ===== PDF を枠の中に描く（pdf.js）。2026-09-19 追加 =====
  // Chrome の「PDFをダウンロードする」設定がオンだと内蔵のPDF表示が使えないため、
  // ページごとに canvas へ描いて縦に並べる（枠の幅いっぱい・簡易表示。文字の選択・検索は無し）
  var PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  var pdfRenderSeq = 0;   // 別のファイルへ切り替えたら古い描画を捨てるための通し番号
  function hidePdfPane() {
    pdfRenderSeq++;
    var pane = document.getElementById('pdfPane');
    if (pane) { pane.style.display = 'none'; pane.innerHTML = ''; }
  }
  function showPdfInline(url) {
    var pane = document.getElementById('pdfPane');
    var seq = ++pdfRenderSeq;
    iframe.style.display = 'none';
    pane.style.display = 'block';
    pane.innerHTML = '<div class="pdf-msg">PDFを読み込み中…</div>';
    buildOutline();   // PDFには目次が無いので、前のファイルの目次を消す
    if (!pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(function (buf) {
      // cMapUrl：日本語などの文字対応表（無いと CJK の字が抜ける）。standardFontDataUrl：埋め込みの無い標準フォントの代替
      return pdfjsLib.getDocument({
        data: buf,
        cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
      }).promise;
    }).then(function (pdf) {
      if (seq !== pdfRenderSeq) return;
      pane.innerHTML = '';
      var head = document.createElement('div');
      head.className = 'pdf-msg';
      head.textContent = pdf.numPages + 'ページ（簡易表示。文字の選択・検索はできません）';
      pane.appendChild(head);
      var width = Math.max(200, pane.clientWidth - 24);
      var dpr = window.devicePixelRatio || 1;
      var chain = Promise.resolve();
      for (var i = 1; i <= pdf.numPages; i++) {
        (function (n) {
          chain = chain.then(function () {
            if (seq !== pdfRenderSeq) return;
            return pdf.getPage(n).then(function (page) {
              if (seq !== pdfRenderSeq) return;
              var base = page.getViewport({ scale: 1 });
              var vp = page.getViewport({ scale: width / base.width });
              var canvas = document.createElement('canvas');
              canvas.width = Math.floor(vp.width * dpr);
              canvas.height = Math.floor(vp.height * dpr);
              canvas.style.width = Math.floor(vp.width) + 'px';
              canvas.style.height = Math.floor(vp.height) + 'px';
              pane.appendChild(canvas);
              var ctx = { canvasContext: canvas.getContext('2d'), viewport: vp };
              if (dpr !== 1) ctx.transform = [dpr, 0, 0, dpr, 0, 0];
              return page.render(ctx).promise;
            });
          });
        })(i);
      }
      return chain;
    }).catch(function (e) {
      if (seq !== pdfRenderSeq) return;
      pane.innerHTML = '<div class="pdf-msg">PDFを表示できませんでした（' + esc(String((e && e.message) || e)) + '）</div>';
    });
  }

  function stripFrontmatter(md) {
    // 先頭の YAML フロントマター(--- ... ---)を本文と同じフォントの改行つきテキストに変換し、
    // marked が見出し化して改行を潰すのを防ぐ（各項目を改行表示）。
    var m = /^﻿?---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(md);
    if (!m) return md;
    var fm = m[1].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return '<div style="white-space:pre-wrap;border-bottom:1px solid #e5e5e5;padding-bottom:8px;margin-bottom:14px;">' + fm + '</div>\n\n' + md.slice(m[0].length);
  }

  // 見出しに id を付ける（2026-09-22 追加）。marked は id を付けないため、
  // マークダウンの中の目次リンク（[見出し](#見出し)）がどこにも飛べなかった。
  // 付ける id は GitHub と同じ作り方：小文字にし、記号を落とし、空白を - にする。
  // これで GitHub で通る目次リンクが、このビューアでもそのまま通る
  function slugOf(text) {
    return String(text).trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\p{M}\s_-]/gu, '')
      .replace(/\s/g, '-');   // 空白1つが - 1つ（GitHub と同じ。まとめて1つにしない）
  }
  // 地の文に書いた Windows のパスも押して開けるようにする（2026-09-26 本人指示）。
  // marked がリンクにするのはリンク記法と http から始まる URL だけで、C:\... は素通りしていた。
  // 行の折り返しで空白が入ることがあるため、直後が \ の空白だけは中に含める
  var WIN_PATH = /[A-Za-z]:\\(?:[^\s"'<>|*?、。）」]|[ \t](?=\\))+/g;
  function linkifyPaths(doc) {
    var walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null);
    var targets = [], n;
    while ((n = walker.nextNode())) {
      if (!n.parentNode || (n.parentNode.closest && n.parentNode.closest('a, .hhpath'))) continue;
      WIN_PATH.lastIndex = 0;
      if (WIN_PATH.test(n.nodeValue)) targets.push(n);
    }
    targets.forEach(function (node) {
      var frag = doc.createDocumentFragment(), t = node.nodeValue, last = 0, m;
      WIN_PATH.lastIndex = 0;
      while ((m = WIN_PATH.exec(t))) {
        if (m.index > last) frag.appendChild(doc.createTextNode(t.slice(last, m.index)));
        var sp = doc.createElement('span');
        sp.className = 'hhpath';
        sp.setAttribute('data-p', m[0].replace(/[ \t]+/g, ''));   // 折り返しで入った空白は外す
        sp.setAttribute('title', '押すとこのファイルを開きます');
        sp.textContent = m[0];
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (last < t.length) frag.appendChild(doc.createTextNode(t.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  }
  function addHeadingIds(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var used = {};
    doc.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (h) {
      if (h.id) { used[h.id] = 1; return; }
      var base = slugOf(h.textContent) || 'section', id = base, n = 0;
      while (used[id]) { id = base + '-' + (++n); }   // 同じ見出しが2回出たら -1 -2 と足す
      used[id] = 1; h.id = id;
    });
    linkifyPaths(doc);
    return doc.body.innerHTML;
  }

      + 'for(var i=0;i<hs.length;i++){if((hs[i].id||"").toLowerCase()===lo){el=hs[i];break;}}}'
