  // ファイル名で絞り込み：一致した項目と、その親フォルダだけを表示・展開する。
  function revealAll(container) {
    container.querySelectorAll('.tree-folder, .tree-file').forEach(function (n) { n.style.display = ''; });
    container.querySelectorAll('.tree-folder-content').forEach(function (c) { c.style.display = 'block'; });
    container.querySelectorAll('.tree-folder-name').forEach(function (f) { f.dataset.open = 'true'; });
  }
  function filterTree(container, q) {
    var any = false;
    container.querySelectorAll(':scope > .tree-folder, :scope > .tree-file').forEach(function (node) {
      if (node.classList.contains('tree-file')) {
        var a = node.querySelector('a');
        var hit = !!a && a.textContent.toLowerCase().indexOf(q) >= 0;
        node.style.display = hit ? '' : 'none';
        if (hit) any = true;
      } else {
        var labelEl = node.querySelector(':scope > .tree-folder-name > .tree-folder-label');
        var nameEl = node.querySelector(':scope > .tree-folder-name');
        var content = node.querySelector(':scope > .tree-folder-content');
        var nameHit = !!labelEl && labelEl.textContent.toLowerCase().indexOf(q) >= 0;
        var childHit = false;
        if (nameHit && content) { revealAll(content); childHit = true; }
        else if (content) { childHit = filterTree(content, q); }
        var show = nameHit || childHit;
        node.style.display = show ? '' : 'none';
        if (content) content.style.display = show ? 'block' : 'none';
        if (nameEl) nameEl.dataset.open = show ? 'true' : 'false';
        if (show) any = true;
      }
    });
    return any;
  }
  function restoreTreeDisplay() {
    treeEl.querySelectorAll('.tree-file, .tree-folder').forEach(function (el) { el.style.display = ''; });
    var open = getOpen();
    treeEl.querySelectorAll('.tree-folder-name').forEach(function (f) {
      var isOpen = open.indexOf(f.dataset.path) >= 0;
      f.dataset.open = isOpen ? 'true' : 'false';
      if (f.nextElementSibling) f.nextElementSibling.style.display = isOpen ? 'block' : 'none';
    });
  }
  searchInputEl.addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    var grepBar = document.getElementById('treeGrep');
    // 絞り込み中はまとまり見出しを隠す（中身が消えた見出しだけ残ると紛らわしい）
    treeEl.querySelectorAll('.tree-group-head').forEach(function (h) { h.style.display = q ? 'none' : ''; });
    if (!q) { restoreTreeDisplay(); grepBar.style.display = 'none'; return; }
    var any = filterTree(treeEl, q);
    // 名前で見つからなくても中身から探せるよう、絞り込み中は常に本文検索ボタンを出す
    var raw = this.value.trim();
    grepBar.textContent = '🔎 本文を検索「' + raw + '」' + (any ? '' : '（名前の一致なし）');
    grepBar.dataset.grepq = raw;
    grepBar.style.display = 'block';
  });
  document.getElementById('treeGrep').addEventListener('click', function () {
    if (this.dataset.grepq) runGrep(this.dataset.grepq);
  });

  // ===== ブックマーク（よく使うファイル・フォルダを上部に固定して一発で開く） =====
  // 置き場はブラウザ内（localStorage）。開いたフォルダ・履歴・表示モードと同じ扱い。
  // ツリーの全行（2万件超）にボタンを置くと重くなるため、登録は上部の★ボタンで行い、
  // ツリー側は登録済みの行にだけ★印を後から付ける。
  var BM_KEY = 'allViewerBookmarks';

  function getBm() { try { return JSON.parse(localStorage.getItem(BM_KEY)) || []; } catch (e) { return []; } }
  function setBm(a) { try { localStorage.setItem(BM_KEY, JSON.stringify(a)); } catch (e) {} }
  function isBm(p) {
    var lp = (p || '').toLowerCase();
    return getBm().some(function (b) { return b.path.toLowerCase() === lp; });
  }
  // 読み込み済みのツリーから、そのパスがフォルダかどうかを調べる
  function isDirPath(p) {
    var lp = p.toLowerCase();
    for (var i = 0; i < flatIndex.length; i++) {
      if (flatIndex[i].path.toLowerCase() === lp) return !!flatIndex[i].dir;
    }
    return false;
  }
  function toggleBm(p) {
    if (!p) return;
    var lp = p.toLowerCase();
    var a = getBm();
    var hit = a.filter(function (b) { return b.path.toLowerCase() === lp; });
    if (hit.length) {
      a = a.filter(function (b) { return b.path.toLowerCase() !== lp; });
    } else {
      a.push({ path: p, name: baseName(p), dir: isDirPath(p) });
    }
    setBm(a);
    renderBookmarks();
    markTreeBookmarks();
    updateBmBtn();
  }
  function updateBmBtn() {
    var btn = document.getElementById('bmBtn');
    if (!btn) return;
    var on = isBm(normPath(urlInput.value));
    btn.classList.toggle('on', on);
    btn.title = on ? 'ブックマークから外す' : '今のパスをブックマークに登録';
  }
  // 置き場所を「作業フォルダの最上位から下」だけにして短くする
  // （C:\Users\... のような手前の部分は毎回同じで読む意味がないため）
  function bmRelDir(p) {
    var d = dirName(p);
    var root = (treeRootPath || '').replace(/[\\/]+$/, '');
    if (!root) return d;
    var dl = d.toLowerCase(), rl = root.toLowerCase();
    if (dl === rl) return '（作業フォルダの直下）';
    if (dl.indexOf(rl + '\\') === 0) return d.substring(root.length + 1);
    return d;   // 作業フォルダの外（.claude 等）は、そのまま出す
  }
  function renderBookmarks() {
    var a = getBm();
    if (!a.length) { bmBoxEl.style.display = 'none'; bmListEl.innerHTML = ''; return; }
    // 同じフォルダのものが隣り合うよう、フォルダ名 → 名前 の順に並べ替える
    // （登録した順ではなく名前順。保存してある順序は変えない）
    a = a.slice().sort(function (x, y) {
      var c = bmRelDir(x.path).localeCompare(bmRelDir(y.path), 'ja');
      if (c !== 0) return c;
      return String(x.name).localeCompare(String(y.name), 'ja');
    });
    var html = '';
    a.forEach(function (b) {
      html += '<div class="bm-item" data-path="' + esc(b.path) + '" title="' + esc(b.path) + '">'
        + '<div class="bm-l1">'
        + '<span class="uh-icon">' + iconOf(b.name, b.dir) + '</span>'
        + '<span class="bm-name">' + esc(b.name) + '</span>'
        + '<span class="bm-del" title="ブックマークから外す">×</span>'
        + '</div>'
        + '<div class="bm-dir">' + esc(bmRelDir(b.path)) + '</div>'
        + '</div>';
    });
    bmListEl.innerHTML = html;
    bmBoxEl.style.display = 'block';
  }
  // 登録済みの行にだけ★印を付ける（件数が少ないので総なめしない）
  function bmSelector(p) {
    return '.tree-c-copy[data-path="' + p.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"]';
  }
  function markTreeBookmarks() {
    treeEl.querySelectorAll('.tree-bm-star').forEach(function (s) { s.remove(); });
    getBm().forEach(function (b) {
      var c = null;
      try { c = treeEl.querySelector(bmSelector(b.path)); } catch (e) { return; }
      if (!c) return;
      var star = document.createElement('span');
      star.className = 'tree-bm-star';
      star.textContent = '★';
      c.parentNode.insertBefore(star, c);
    });
  }
  function openBookmark(p) {
    if (isDirPath(p)) {
      urlInput.value = p;
      updateClearBtn();
      updateBmBtn();
      addHistory(p);
      if (!revealFolderInTree(p)) refreshTree(function () { revealFolderInTree(p); });
      return;
    }
    openFile(p);
    revealInTree(p);
  }

  document.getElementById('bmBtn').addEventListener('click', function () {
    var p = normPath(urlInput.value);
    var msg = document.getElementById('saveMsg');
    if (!p || !isAbsPath(p)) {
      msg.style.color = '#c00';
      msg.textContent = 'ブックマークするファイル／フォルダを開いてから押してください';
      return;
    }
    toggleBm(p);
  });
  bmListEl.addEventListener('click', function (e) {
    var del = e.target.closest('.bm-del');
    if (del) {
      var row = del.closest('.bm-item');
      if (row) toggleBm(row.dataset.path);
      return;
    }
    var item = e.target.closest('.bm-item');
    if (item) openBookmark(item.dataset.path);
  });
  urlInput.addEventListener('input', updateBmBtn);
  renderBookmarks();

  // ブックマーク欄の高さをドラッグで変更（高さは記憶する）
  (function () {
    var grip = document.getElementById('bmResize');
    if (!grip) return;
    var KEY = 'allViewerBmHeight';
    function clampH(h) {
      h = parseInt(h, 10);
      if (isNaN(h)) return 210;
      if (h < 40) h = 40;          // つまみを掴めなくならない最小限だけ残す
      if (h > 4000) h = 4000;      // 実質無制限（2026-08-28 上限800で頭打ちになる指摘を受け撤廃）
      return h;
    }
    bmListEl.style.height = clampH(localStorage.getItem(KEY) || 210) + 'px';
    grip.addEventListener('mousedown', function (e) {
      // メニューが別窓に切り離されていても動くよう、要素が今いる文書で監視する
      var doc = grip.ownerDocument;
      grip.classList.add('dragging');
      doc.body.style.cursor = 'row-resize';
      doc.body.style.userSelect = 'none';
      function move(ev) {
        if (ev.buttons === 0) { stop(); return; }
        bmListEl.style.height = clampH(ev.clientY - bmListEl.getBoundingClientRect().top) + 'px';
      }
      function stop() {
        doc.removeEventListener('mousemove', move);
        doc.removeEventListener('mouseup', stop);
        grip.classList.remove('dragging');
        doc.body.style.cursor = '';
        doc.body.style.userSelect = '';
        try { localStorage.setItem(KEY, parseInt(bmListEl.style.height, 10)); } catch (err) {}
      }
      doc.addEventListener('mousemove', move);
      doc.addEventListener('mouseup', stop);
      e.preventDefault();
    });
  })();

  // ===== 目次ペイン：開いたMarkdown/HTMLの見出し一覧を右側に出す =====
  var outlineTargets = [];
  var OUTLINE_KEY = 'allViewerOutlineHidden';

  function outlineHidden() {
    try { return localStorage.getItem(OUTLINE_KEY) === '1'; } catch (e) { return false; }
  }
  function applyOutlineVisibility() {
    var pane = document.getElementById('outlinePane');
    var btn = document.getElementById('outlineBtn');
    var has = outlineTargets.length > 0;
    btn.style.display = has ? 'inline-block' : 'none';   // CSS既定がnoneのため明示する
    btn.classList.toggle('on', has && !outlineHidden());
    pane.style.display = (has && !outlineHidden()) ? 'block' : 'none';
  }
  function buildOutline() {
    var pane = document.getElementById('outlinePane');
    outlineTargets = [];
    pane.innerHTML = '';
    var ext = extOf(currentWin || '');
    if (ext === '.md' || ext === '.html' || ext === '.htm') {
      var doc;
      try { doc = iframe.contentDocument; } catch (e) { doc = null; }
      if (doc) {
        var hs = doc.querySelectorAll('h1, h2, h3');
        if (hs.length >= 2) {
          var html = '<div class="ol-head">目次（' + hs.length + '）</div>';
          for (var i = 0; i < hs.length; i++) {
            var lv = hs[i].tagName.charAt(1);
            html += '<div class="ol-item ol-l' + lv + '" data-i="' + i + '" title="'
              + esc(hs[i].textContent) + '">' + esc(hs[i].textContent) + '</div>';
          }
          pane.innerHTML = html;
          outlineTargets = Array.prototype.slice.call(hs);
        }
      }
    }
    applyOutlineVisibility();
  }
  iframe.addEventListener('load', buildOutline);
  document.getElementById('outlinePane').addEventListener('click', function (e) {
    var item = e.target.closest('.ol-item');
    if (!item) return;
    var h = outlineTargets[parseInt(item.dataset.i, 10)];
    if (h && h.scrollIntoView) h.scrollIntoView({ block: 'start' });
  });
  document.getElementById('outlineBtn').addEventListener('click', function () {
    try { localStorage.setItem(OUTLINE_KEY, outlineHidden() ? '0' : '1'); } catch (e) {}
    applyOutlineVisibility();
  });

  // ===== 全文検索（本文検索）。索引方式：api/fts.php =====
  // 入り口は左メニューの専用欄（#grepInput・Enterで実行）。ファイル名検索とは完全に別扱い。
  // 結果は左の専用パネル（#grepPanel）に「ファイル名＋場所＋ヒット行」で一覧し、クリックで開く。
  var grepPanelEl = document.getElementById('grepPanel');
  var grepListEl = document.getElementById('grepList');
  var grepHeadEl = document.getElementById('grepHead');

  function grepMsg(text) {
    grepPanelEl.style.display = 'block';
    grepHeadEl.textContent = text;
    grepListEl.innerHTML = '';
  }

  function renderGrepPanel(d) {
    grepPanelEl.style.display = 'block';
    grepHeadEl.textContent = '「' + d.q + '」 一致 ' + d.hits.length + '件'
      + (d.truncated ? '（多すぎるため一部のみ）' : '');
    var html = '';
    d.hits.forEach(function (h) {
      html += '<div class="grep-item" data-path="' + esc(h.path) + '" title="' + esc(h.path) + '">'
        + '<div class="gname">' + iconOf(baseName(h.path), false) + ' ' + esc(baseName(h.path)) + '</div>'
        + '<div class="gdir">' + esc(bmRelDir(h.path)) + '</div>'
        + '<div class="gtext">' + h.line + '行目: ' + esc(h.text) + '</div>'
        + '</div>';
    });
    grepListEl.innerHTML = html || '<div class="grep-item">一致するファイルはありません</div>';
  }

  function runGrepBuild(q) {
    fetch('api/fts.php?op=build&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.remaining > 0) {
          grepMsg('索引を作成中… 残り ' + d.remaining + ' ファイル（初回だけ時間がかかります）');
          runGrepBuild(q);
        } else {
          runGrepPanel(q);
        }
      })
      .catch(function () { grepMsg('索引の作成に失敗しました'); });
  }

  // 検索を速く保つため、索引の鮮度合わせ（フォルダ走査）は裏で静かに行う。
  // 検索のたびに1回だけ起動し、残りが無くなるまで回す（画面には出さない）。
  var grepBgBusy = false;
  function grepBgRefresh() {
    if (grepBgBusy) return;
    grepBgBusy = true;
    (function step(rounds) {
      fetch('api/fts.php?op=build&t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.remaining > 0 && rounds < 30) step(rounds + 1);
          else grepBgBusy = false;
        })
        .catch(function () { grepBgBusy = false; });
    })(0);
  }

  function runGrepPanel(q) {
    q = (q || '').trim();
    if (q.length < 2) { grepMsg('2文字以上で検索してください'); return; }
    document.getElementById('grepInput').value = q;
    hideHistory();   // 上の候補リストから来た場合は閉じる
    grepMsg('「' + q + '」を検索中…');
    fetch('api/fts.php?op=search&q=' + encodeURIComponent(q) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.need_build) { runGrepBuild(q); return; }
        if (d.error) { grepMsg('検索できません: ' + d.error); return; }
        renderGrepPanel(d);
        grepBgRefresh();
      })
      .catch(function () { grepMsg('本文検索に失敗しました'); });
  }
  var runGrep = runGrepPanel;   // 旧呼び出し名の互換（候補リストの🔎・絞り込み欄下のボタンも同じ結果パネルに出す）

  document.getElementById('grepInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); runGrepPanel(this.value); }
    if (e.key === 'Escape') { grepPanelEl.style.display = 'none'; }
  });
  document.getElementById('grepClose').addEventListener('click', function () {
    grepPanelEl.style.display = 'none';
    grepListEl.innerHTML = '';
  });
  grepListEl.addEventListener('click', function (e) {
    var item = e.target.closest('.grep-item');
    if (item && item.dataset.path) openFile(item.dataset.path);
  });

  // ===== 編集機能 =====
  function exitEdit() {
    editor.style.display = 'none';
    document.getElementById('saveBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('editBtn').style.display = (EDIT_EXT.indexOf(extOf(currentWin)) >= 0 && currentWin) ? '' : 'none';
    document.getElementById('saveMsg').textContent = '';
  }
  document.getElementById('editBtn').addEventListener('click', function () {
    if (!currentWin) return;
    // 元の生テキストを取得して textarea に入れる
    fetch(toUrl(currentWin) + '&t=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
      editor.value = t;
      iframe.style.display = 'none';
      document.getElementById('outlinePane').style.display = 'none';
      document.getElementById('outlineBtn').style.display = 'none';
      editor.style.display = 'block';
      document.getElementById('editBtn').style.display = 'none';
      document.getElementById('saveBtn').style.display = '';
      document.getElementById('cancelBtn').style.display = '';
    });
  });
  document.getElementById('cancelBtn').addEventListener('click', function () {
    exitEdit();
    openFile(currentWin); // 閲覧に戻す
  });
  document.getElementById('saveBtn').addEventListener('click', function () {
    if (!currentWin) return;
    var msg = document.getElementById('saveMsg');
    msg.style.color = '#888'; msg.textContent = '保存中...';
    var body = new URLSearchParams();
    body.append('p', currentWin);
    body.append('body', editor.value);
    fetch('save.php', { method: 'POST', body: body })
      .then(function (r) { return r.text().then(function(t){ return {ok:r.ok, t:t}; }); })
      .then(function (res) {
        if (res.ok) { msg.style.color = '#178a3a'; msg.textContent = '保存しました (' + res.t + ')'; }
        else { msg.style.color = '#c00'; msg.textContent = '保存失敗: ' + res.t; }
      })
      .catch(function (e) { msg.style.color = '#c00'; msg.textContent = '保存失敗: ' + e; });
  });

  // ===== メニューの大きさをドラッグで変更（左＝幅・下＝高さ。どちらも記憶する） =====
  (function () {
    var menu = document.querySelector('.menu');
    var dragbar = document.getElementById('dragbar');
    var iframe = document.getElementById('viewer');
    function clamp(w) { w = parseInt(w, 10); if (isNaN(w)) return 520; if (w < 150) w = 150; if (w > 1400) w = 1400; return w; }
    menu.style.width = clamp(localStorage.getItem('allViewerMenuWidth') || 520) + 'px';
    if (!dragbar) return;
    var dragging = false;
    function stop() {
      if (!dragging) return;
      dragging = false;
      dragbar.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      if (iframe) iframe.style.pointerEvents = '';
      if (currentMenuMode === 'bottom') {
        var h = parseInt(menu.style.height, 10);
        if (!isNaN(h)) localStorage.setItem('allViewerMenuHeight', h);
      } else {
        var w = parseInt(menu.style.width, 10);
        if (!isNaN(w)) localStorage.setItem('allViewerMenuWidth', w);
      }
    }
    dragbar.addEventListener('mousedown', function (e) {
      dragging = true;
      dragbar.classList.add('dragging');
      document.body.style.cursor = (currentMenuMode === 'bottom') ? 'row-resize' : 'col-resize';
      document.body.style.userSelect = 'none';
      if (iframe) iframe.style.pointerEvents = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      if (e.buttons === 0) { stop(); return; }
      if (currentMenuMode === 'bottom') {
        menu.style.height = clampMenuHeight(window.innerHeight - e.clientY) + 'px';
      } else {
        menu.style.width = clamp(e.clientX - menu.getBoundingClientRect().left) + 'px';
      }
    });
    document.addEventListener('mouseup', stop);
    window.addEventListener('blur', stop);
  })();

  // 下モードのメニュー高さの範囲（画面を全部覆わないよう上限を付ける）
  function clampMenuHeight(h) {
    h = parseInt(h, 10);
    if (isNaN(h)) h = 320;
    var max = window.innerHeight - 120;
    if (h < 100) h = 100;
    if (h > max) h = max;
    return h;
  }

  // ===== メニューの置き場所（左 / 下）。状態は記憶する =====
  (function () {
    var container = document.querySelector('.container');
    var bBtn = document.getElementById('modeBottomBtn');
    var KEY = 'allViewerMenuMode';
    if (!container || !bBtn) return;

    function apply(mode) {
      currentMenuMode = mode;
      container.classList.toggle('mode-bottom', mode === 'bottom');
      bBtn.classList.toggle('active', mode === 'bottom');
      // 下のときだけ高さを持たせる（左は指定しない＝CSSに任せる）
      menuEl.style.height = (mode === 'bottom')
        ? clampMenuHeight(localStorage.getItem('allViewerMenuHeight') || 320) + 'px'
        : '';
    }
    var saved = 'left';
    try { saved = localStorage.getItem(KEY) || 'left'; } catch (e) {}
    apply(saved === 'bottom' ? 'bottom' : 'left');

    // 同じボタンをもう一度押すと左（既定）に戻る
    bBtn.addEventListener('click', function () {
      var mode = (currentMenuMode === 'bottom') ? 'left' : 'bottom';
      apply(mode);
      try { localStorage.setItem(KEY, mode); } catch (e) {}
    });
  })();

  // ===== メニューを別ウィンドウへ切り離す（操作パネルとして独立させる） =====
  // ツリーを作り直すのではなく、メニューの要素そのものを別ウィンドウへ移す。
  // こうすると読み込み済みのツリー・検索索引・イベントがそのまま生き、
  // 別窓でファイルを選ぶと本体側のビューアに表示される。
  (function () {
    var container = document.querySelector('.container');
    var btn = document.getElementById('modePopupBtn');
    if (!container || !btn) return;
    var win = null;         // 切り離し先のウィンドウ
    var slot = null;        // 戻す位置の目印
    var watcher = null;     // 手で閉じられたのを検知する

    function detach() {
      var w = parseInt(menuEl.style.width, 10) || 520;
      win = window.open('', 'hatohatoscopeMenu', 'width=' + (w + 60) + ',height=900,left=60,top=60');
      if (!win) {
        var msg = document.getElementById('saveMsg');
        msg.style.color = '#c00';
        msg.textContent = '別窓を開けませんでした（ブラウザのポップアップ許可が必要です）';
        return;
      }
      // 本体と同じ見た目にするため、スタイルをそのまま複製して渡す
      var css = '';
      var st = document.querySelector('style');
      if (st) css = st.textContent;
      win.document.head.innerHTML = '<meta charset="UTF-8"><title>hatohatoscope — メニュー</title>'
        + '<style>' + css + 'body{margin:0;background:#f7f7f7;}'
        + '.menu{width:auto !important;height:100vh !important;max-width:none;}</style>';
      win.document.body.innerHTML = '';
      // 戻す位置に目印を置いてから、メニュー本体ごと移す
      slot = document.createComment('menu-slot');
      menuEl.parentNode.insertBefore(slot, menuEl);
      menuEl.classList.remove('collapsed');   // 隠した状態のまま移すと別窓が空になる
      win.document.body.appendChild(win.document.adoptNode(menuEl));
      container.classList.add('mode-detached');
      btn.classList.add('active');
      // ★別窓が閉じられる「前」に本体へ戻す。
      // 閉じ切ってから戻すと、破棄された文書と一緒にクリック等のイベントが失われ、
      // 見た目は戻っているのに検索もクリックも効かないメニューになる（2026-08-22 実測）。
      win.addEventListener('beforeunload', function () { redock(); });
      // 上が働かなかったときの保険。ここに来た場合はイベントが死んでいるので読み直す
      watcher = setInterval(function () {
        if (!win || win.closed) {
          var lost = (menuEl.ownerDocument !== document);
          redock();
          if (lost) location.reload();
        }
      }, 500);
      win.focus();
    }

    function redock() {
      if (watcher) { clearInterval(watcher); watcher = null; }
      if (menuEl.ownerDocument !== document) {
        document.adoptNode(menuEl);
        if (slot && slot.parentNode) {
          slot.parentNode.insertBefore(menuEl, slot);
          slot.parentNode.removeChild(slot);
        } else {
          container.insertBefore(menuEl, container.firstChild);
        }
      }
      slot = null;
      container.classList.remove('mode-detached');
      btn.classList.remove('active');
      if (win && !win.closed) { try { win.close(); } catch (e) {} }
      win = null;
    }

    btn.addEventListener('click', function () {
      if (win && !win.closed) redock(); else detach();
    });
    // 本体を閉じる・再読込するときは、取り残しになる別窓も閉じる
    window.addEventListener('beforeunload', function () {
      if (win && !win.closed) { try { win.close(); } catch (e) {} }
    });
  })();

  // ===== 左メニューの表示 / 非表示（状態は記憶する） =====
  (function () {
    var menu = document.querySelector('.menu');
    var dragbar = document.getElementById('dragbar');
    var btn = document.getElementById('toggleMenuBtn');
    var KEY = 'allViewerMenuHidden';
    if (!menu || !btn) return;

    function apply(hidden) {
      menu.classList.toggle('collapsed', hidden);
      if (dragbar) dragbar.classList.toggle('collapsed', hidden);
      // 隠しても幅の設定は残るので、表示に戻すと元の幅に復帰する
      btn.textContent = hidden ? '▶' : '◀';
      btn.title = (hidden ? '左メニューを表示する' : '左メニューを隠す') + '（Ctrl+B）';
    }
    function set(hidden) {
      apply(hidden);
      try { localStorage.setItem(KEY, hidden ? '1' : '0'); } catch (e) {}
    }
    function isHidden() { return menu.classList.contains('collapsed'); }

    var saved = '0';
    try { saved = localStorage.getItem(KEY) || '0'; } catch (e) {}
    apply(saved === '1');

    btn.addEventListener('click', function () { set(!isHidden()); });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'b' || e.key === 'B')) {
        e.preventDefault();
        set(!isHidden());
      }
    });
  })();

  // URLで直接ファイルを開く: all.html?open=<Windowsフルパス(encodeURIComponent)>
  (function () {
    var m = location.search.match(/[?&]open=([^&]+)/);
    if (m) {
      try {
        var p = normPath(decodeURIComponent(m[1]));
        openFile(p);
        revealInTree(p);   // この時点ではツリー未読込で空振りするが、load() 完了後に合わせ直す
      } catch (e) {}
    }
  })();

  load();
})();
</script>
</body>
