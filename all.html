  function errHtml(msg) { return '<html><body><p style="color:#c00;padding:20px;">' + msg + '</p></body></html>'; }

  // テキストを表示する（note があれば先頭に一行だけ添える）。
  // lang を渡すと highlight.js で色付けする。大きいファイルは自動で色付けを見送る。
  function textHtml(t, note, lang) {
    var tooBig = t.length > HL_MAX_CHARS;
    var useHl = !!lang && !tooBig;
    if (lang && tooBig) {
      note = (note ? note + ' ／ ' : '')
        + 'サイズが大きいため色付けは省略しました（表示を軽くするため）';
    }
    return '<html><head><meta charset="UTF-8">'
      + (useHl ? '<link rel="stylesheet" href="' + HL_BASE + '/styles/vs2015.min.css">' : '')
      + '<style>body{margin:0;padding:12px;background:#1e1e1e;}'
      + '.note{color:#e6c07b;font-family:sans-serif;font-size:13px;border-bottom:1px solid #444;padding-bottom:8px;margin-bottom:10px;}'
      + 'pre{margin:0;font-family:Consolas,monospace;font-size:14px;color:#d4d4d4;white-space:pre-wrap;word-wrap:break-word;}'
      + 'code{font-family:inherit;font-size:inherit;background:transparent;padding:0;}'
      + '</style>'
      // 読み込めなかった場合でも素のテキストとして読める（色が付かないだけ）
      + (useHl ? '<scr' + 'ipt src="' + HL_BASE + '/highlight.min.js"></scr' + 'ipt>' + hlExtraTags(lang) : '')
      + '</head><body>'
      + (note ? '<div class="note">' + esc(note) + '</div>' : '')
      + '<pre><code' + (useHl ? ' class="language-' + lang + '"' : '') + '>' + esc(t) + '</code></pre>'
      + (useHl ? '<scr' + 'ipt>window.addEventListener("DOMContentLoaded",function(){'
          + 'if(!window.hljs){return;}'
          + 'try{hljs.highlightElement(document.querySelector("pre > code"));}catch(e){}'
          + '});</scr' + 'ipt>' : '')
      + '</body></html>';
  }

  // 相対リンクを絶対パスへ解決する（.. や . も処理。区切りは \ に統一）
  function resolveRelPath(baseDir, href) {
    try { href = decodeURIComponent(href); } catch (e) {}
    href = href.split('#')[0].split('?')[0];
    if (!href) return '';
    href = href.replace(/\//g, '\\');
    var joined = isAbsPath(href) ? href : (baseDir + '\\' + href);
    var parts = joined.split('\\');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var seg = parts[i];
      if (i > 0 && seg === '') continue;
      if (seg === '.') continue;
      if (seg === '..') { if (out.length > 1) out.pop(); continue; }
      out.push(seg);
    }
    return out.join('\\');
  }

  // Markdown表示（srcdoc）内のファイルリンクは、メッセージで受け取ってビューアで開く
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.t !== 'hhscopeOpen' || !d.href) return;
    var p = resolveRelPath(d.dir || dirName(currentWin), d.href);
    if (!p) return;
    openFile(p);
    revealInTree(p);
  });

  // serve 経由で表示したHTML（同一オリジン）にも、読み込み後にリンク振り分けを仕込む。
  // 外部URLは新しいタブ、ファイルへの相対リンクはビューア自身で開く
  iframe.addEventListener('load', function () {
    // srcdoc表示は各テンプレ側のスクリプトが担当。「戻る」で srcdoc の文書に戻ったときも iframe の src 属性は
    // 残ったままなので、属性ではなく、いま出ている文書の場所で見分ける（2026-10-31 変更）
    var doc, href;
    try { doc = iframe.contentDocument; href = iframe.contentWindow.location.href || ''; } catch (e) { return; }   // PDFプラグイン等は触れない
    if (!doc || !doc.addEventListener || !/\/serve\?/.test(href)) return;
    doc.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      var h = a.getAttribute('href') || '';
      if (!h || h.charAt(0) === '#') return;
      e.preventDefault();
      if (h.indexOf('//') === 0) { window.open('https:' + h, '_blank', 'noopener'); return; }
      if (/^[a-z][a-z0-9+.-]*:/i.test(h)) { window.open(a.href, '_blank', 'noopener'); return; }
      var p = resolveRelPath(dirName(currentWin), h);   // 基点は押した時点のファイル（「戻る」で文書が替わっても合う）
      if (p) { openFile(p); revealInTree(p); }
    });
  });

  // 本文の枠のページが「戻る」「進む」などで変わったら、帯、パス欄、ツリーをそのページに合わせる（2026-10-31 本人指示）。
  // パス欄やリンクから開いたときは openFile が先に帯を合わせているので、ここでは何もしない
  iframe.addEventListener('load', function () {
    var shown = shownDocOf();
    if (!shown || (samePath(shown.p, titlePath) && shown.prefix === titlePrefix)) return;
    urlInput.value = shown.p;
    updateClearBtn();
    showFileTitle(shown.p, shown.prefix);
    if (shown.prefix) { document.getElementById('editBtn').style.display = 'none'; return; }   // 差分の表示は showDiff と同じく currentWin を変えない
    currentWin = shown.p;
    syncTopTree(shown.p);
    updateBmBtn();
    document.getElementById('editBtn').style.display = (EDIT_EXT.indexOf(extOf(shown.p)) >= 0) ? '' : 'none';
    revealInTree(shown.p);
  });
  // 本文の枠にいま出ている文書が、どのファイルのものかを返す。serve の URL ならその p、srcdoc なら markDoc の印から読む
  function shownDocOf() {
    var doc, href;
    try { doc = iframe.contentDocument; href = iframe.contentWindow.location.href || ''; } catch (e) { return null; }
    if (!doc) return null;
    if (href.indexOf('about:srcdoc') === 0) {
      var m = doc.querySelector('meta[name="hhscope-path"]');
      if (!m) return null;
      var pre = doc.querySelector('meta[name="hhscope-prefix"]');
      return { p: m.getAttribute('content') || '', prefix: pre ? (pre.getAttribute('content') || '') : '' };
    }
    var mm = href.match(/\/serve\?(?:[^#]*&)?p=([^&#]*)/);
    if (!mm) return null;
    try { return { p: decodeURIComponent(mm[1]), prefix: '' }; } catch (e) { return null; }
  }
  function samePath(a, b) { return String(a || '').toLowerCase() === String(b || '').toLowerCase(); }

  // このビューア自身（mydocs\all.html）かどうか
  function isSelfViewer(winPath) {
    return /[\\\/]mydocs[\\\/]all\.html$/i.test(winPath || '');
  }

  // 差分(.diff/.patch)を色付きで表示（追加=緑／削除=赤／見出し=紫／位置=青）
  function diffHtml(text) {
    var lines = text.split('\n');
    var out = '';
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i], cls = '';
      if (/^# /.test(ln)) cls = 'dh';                            // git_diff の見出し行
      else if (/^\?\? /.test(ln)) cls = 'da';                    // status: 未追跡ファイル
      else if (/^(!!|[ MADRCU][MADRCU]) /.test(ln)) cls = 'dk';  // status: 変更ファイル
      else if (/^\+\+\+ |^--- /.test(ln)) cls = 'dh';
      else if (/^@@/.test(ln)) cls = 'dk';
      else if (/^diff |^index /.test(ln)) cls = 'dh';
      else if (ln.charAt(0) === '+') cls = 'da';
      else if (ln.charAt(0) === '-') cls = 'dr';
      var e = esc(ln);
      out += '<div class="' + cls + '">' + (e === '' ? '&nbsp;' : e) + '</div>';
    }
    return '<html><head><meta charset="UTF-8"><style>'
      + 'body{margin:0;padding:12px;background:#1e1e1e;font-family:Consolas,monospace;font-size:13px;line-height:1.5;}'
      + 'div{white-space:pre-wrap;word-break:break-all;color:#cfcfcf;padding:0 4px;}'
      + '.da{color:#7ee787;background:#10341a;}'
      + '.dr{color:#ffb4ac;background:#3a1115;}'
      + '.dk{color:#79c0ff;background:#10243e;}'
      + '.dh{color:#d2a8ff;font-weight:bold;}'
      + '</style></head><body>' + out + '</body></html>';
  }

  var lastTreeJson = '';   // 直前に描画したツリーのJSON文字列（裏スキャン後の差分検知用）
  var pendingRevealPath = '';  // パス入力で開いたが、ツリー未反映で展開できなかったファイル（再スキャン後に一番上へ出す）
  var refreshQueued = false;   // スキャン実行中に来た再スキャン依頼を捨てず、終わり次第もう1回走らせる
  var scanSeq = 0;             // スキャンの通し番号（開始ごとに+1）
  var renderScanSeq = 0;       // いま描画中のツリーが、どの番号のスキャン結果か
  var pendingSeq = 0;          // pendingRevealPath は、この番号以降のスキャン結果で判定する
  var refreshing = false;  // 裏スキャンの多重起動防止
  var lastRefreshAt = 0;   // 直近のスキャン時刻（フォーカスのたびに走らせないため）

  // 検索モード用に、ツリー全体を平坦な一覧 [{name, path, dir}] にしておく
  var flatIndex = [];
  // 作業フォルダの最上位パス。ブックマークのパス表示を「ここから下」に短くするのに使う
  // （環境ごとに違うので決め打ちせず、ツリーの受け取り時に覚える）
  var treeRootPath = '';
  // 受け取ったツリーの全体と、フォルダのパス（小文字）から中身を引く表。上のツリー（2026-10-31 追加）が、
  // 閉じていたフォルダを開いたときに中身を作るのに使う
  var treeData = null;
  var nodeMap = {};
  // ツリーにあるパスの鍵（bmKey の形）。ブックマークの場所があるかを、サーバーに聞かずに確かめるのに使う（2026-11-03 追加）
  var treeKeys = {};
  // パス欄から閲覧範囲に足したフォルダ（パスの小文字）。右クリックに「閲覧範囲から外す」を出すのに使う（2026-10-31 追加）
  var addedRoots = {};
  function buildIndex(items) {
    items.forEach(function (it) {
      treeKeys[bmKey(it.path)] = true;
      if (it.children) {
        flatIndex.push({ name: it.name, path: it.path, dir: true });
        nodeMap[it.path.toLowerCase()] = it;
        buildIndex(it.children);
      } else {
        flatIndex.push({ name: it.name, path: it.path, dir: false });
      }
    });
  }

  function renderTree(data, keepScroll) {
    var menu = menuEl;
    var st = treeEl ? treeEl.scrollTop : 0;   // スクロールはツリー自身が持つ
    var prevRoot = treeRootPath;
    if (data.path) treeRootPath = data.path;
    // ツリーより先に開いたファイル（?open= や、ページを開いた直後）は、作業フォルダが分からないまま
    // 場所の階段を描いていて、C: から始まる絶対パスになっている。作業フォルダが分かった時点で描き直す（2026-10-31）
    if (titlePath && treeRootPath !== prevRoot) layoutFileTitle(titlePath);
    flatIndex = [];
    nodeMap = {};
    treeKeys = {};
    buildIndex(data.children || []);
    addedRoots = {};
    (data.children || []).forEach(function (it) { if (it.added) addedRoots[it.path.toLowerCase()] = true; });
    // 作業フォルダ直下のフォルダごとにファイルを数える（行を作る前に。外の閲覧範囲は数えない）
    topCounts = {}; topCountMax = 0;
    (data.children || []).forEach(function (it) {
      if (!it.children || !inWorkspace(it.path)) return;
      var n = countFiles(it);
      topCounts[it.path.toLowerCase()] = n;
      if (n > topCountMax) topCountMax = n;
    });
    treeData = data;
    treeEl.innerHTML = render(data.children || [], 0);
    // 絞り込み中なら、描き直したツリーにも同じ絞り込みをかけ直す
    var q = searchInputEl.value.trim().toLowerCase();
    if (q) filterTree(treeEl, q);
    refreshTopTree();   // 選んだ場所の階層も、新しい中身で道筋を描き直す
    // ツリーが出来た後に、今開いているファイルを選択状態にし直す。
    // （?open= やパス入力は、ツリー読込より先に走ることがあり、その時点では項目が無くて空振りするため）
    // パス入力で開いたが再スキャン待ちだったファイルは、ここで初めて見つかる。
    // その場合はスクロール復元をせず、そのファイルを一番上に出す（2026-09-05 修正）
    var revealedNow = false;
    if (pendingRevealPath) {
      revealedNow = revealInTreeFolderTop(pendingRevealPath);   // パス入力や右クリックで開いたファイルなので、フォルダを上にそろえる
      // 依頼より前に始まっていた古いスキャンの結果で「無い」と判定しない。
      // 依頼後に始まったスキャンでも見つからなければ諦める（除外対象など）
      if (revealedNow || renderScanSeq >= pendingSeq) pendingRevealPath = '';
    }
    if (!revealedNow && currentWin) revealInTree(currentWin, true);   // 選んだ印を付け直すだけなので、上のツリーは動かさない
    // 裏の自動更新では、見ていた位置が飛ばないようスクロールを元に戻す
    if (keepScroll && treeEl && !revealedNow) treeEl.scrollTop = st;
    // ツリーが変わったので、ブックマークの場所があるかを確かめ直して描く
    renderBookmarks();
    checkBms(true);
    markTreeBookmarks();
    // gitの変更状態で色をつける（非同期・失敗しても表示には影響させない）
    applyGitStatus();
    markTreeBookmarks();
  }

  // ===== gitの状態でツリーに色をつける（VS Code風：変更=オレンジ・新規=緑） =====
  // 取った状態は覚えておき、上のツリー（2026-10-31 追加）を描き直したときにも同じ色を付ける
  var gitFiles = null, gitDirs = null;
  function applyGitStatus() {
    fetch('git_status?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (data) {
      if (!data || !data.files) return;
      var files = {};
      var dirs = {};   // 変更を含むフォルダ（modが優先）
      Object.keys(data.files).forEach(function (p) {
        var cls = data.files[p];
        files[p.toLowerCase()] = cls;
        var cur = p, i;
        while ((i = cur.lastIndexOf('\\')) > 2) {
          cur = cur.substring(0, i);
          var k = cur.toLowerCase();
          if (dirs[k] === 'mod') break;
          dirs[k] = (cls === 'mod') ? 'mod' : (dirs[k] || 'new');
        }
      });
      gitFiles = files; gitDirs = dirs;
      paintGit(treeEl);
      paintGit(topTreeEl);
    }).catch(function () {});
  }
  function paintGit(box) {
    if (!box || !gitFiles) return;
    var files = gitFiles, dirs = gitDirs;
    // ±ボタンは 2026-09-12 に廃止（行に印が増えると階層が見づらくなるため。差分は上部の「差分」ボタンで見る）。
    // 過去の描画で残っている±があれば剥がすだけにする。
    function syncDiffBtn(row, copyEl, cls) {
      var d = row.querySelector(':scope > .tree-d-btn') || (copyEl.nextElementSibling && copyEl.nextElementSibling.classList && copyEl.nextElementSibling.classList.contains('tree-d-btn') ? copyEl.nextElementSibling : null);
      if (d) d.remove();
    }
    box.querySelectorAll('.tree-file').forEach(function (n) {
      var c = n.querySelector('.tree-c-copy');
      var a = n.querySelector('a');
      if (!c || !a) return;
      a.classList.remove('git-mod', 'git-new');
      var cls = files[(c.dataset.path || '').toLowerCase()];
      if (cls) a.classList.add('git-' + cls);
      syncDiffBtn(n, c, cls);
    });
    box.querySelectorAll('.tree-folder-name').forEach(function (f) {
      f.classList.remove('git-mod', 'git-new');
      var c = f.querySelector('.tree-c-copy');
      var cls = dirs[(f.dataset.path || '').toLowerCase()];
      if (cls) f.classList.add('git-' + cls);
      if (c) syncDiffBtn(f, c, cls);
    });
  }

  // 色の自動更新：画面に戻ってきた時＋2分ごとに取り直す（連発は30秒に1回まで。
  // サーバ側にも90秒キャッシュがあるので、実際の全リポジトリスキャンは適度な頻度に収まる）
  var lastGitStatusAt = 0;
  function refreshGitStatus() {
    if (document.hidden) return;   // タブが見えていない間は何もしない（無駄な負荷をかけない）
    if (Date.now() - lastGitStatusAt < 30000) return;
    lastGitStatusAt = Date.now();
    applyGitStatus();
  }
  window.addEventListener('focus', refreshGitStatus);
  setInterval(refreshGitStatus, 120000);

  function load(fresh) {
    treeEl.innerHTML = '<div class="loading">読込中... 作業フォルダ全体をスキャン中（初回は数十秒、2回目以降は即時）</div>';
    fetch(API + (fresh ? '&fresh=1' : '') + '&t=' + Date.now()).then(function (r) {
      var hit = (r.headers.get('X-Cache') === 'HIT');
      return r.text().then(function (t) { return { text: t, hit: hit }; });
    }).then(function (res) {
      var data = JSON.parse(res.text);
      if (data.error) { treeEl.innerHTML = '<div class="loading">エラー: ' + esc(data.error) + '</div>'; return; }
      lastTreeJson = res.text;
      renderTree(data);
      // キャッシュ表示だったときは、裏で再スキャンして「作ったばかりのファイル」を自動反映する。
      // （従来は5分キャッシュのため、新規ファイルは「更新」を押すまでツリーに出なかった）
      if (res.hit) refreshTree(); else lastRefreshAt = Date.now();
    }).catch(function (e) {
      treeEl.innerHTML = '<div class="loading">読込エラー（server.py が起動しているか、http://localhost/mydocs/all.html で開いているか確認）</div>';
    });
  }

  // 裏で再スキャンし、変化があった時だけツリーを描き直す（表示中の操作は妨げない）
  var afterRefresh = null;  // 再スキャン完了後に1回だけ実行する処理（フォルダ展開など）
  function refreshTree(after) {
    if (after) afterRefresh = after;
    // 実行中なら依頼を捨てず順番待ちにする（走っている古いスキャンには、いま作ったファイルが入っていないため）
    if (refreshing) { refreshQueued = true; return; }
    refreshing = true;
    lastRefreshAt = Date.now();
    var mySeq = ++scanSeq;
    var btn = reloadBtnEl;
    btn.disabled = true; btn.textContent = '更新中…';
    fetch(API + '&fresh=1&t=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
      var data = JSON.parse(t);
      if (!data.error && t !== lastTreeJson) { lastTreeJson = t; renderScanSeq = mySeq; renderTree(data, true); }
    }).catch(function () {}).then(function () {
      refreshing = false;
      btn.disabled = false; btn.textContent = '更新';
      var fn = afterRefresh; afterRefresh = null;
      if (fn) fn();
      if (refreshQueued) { refreshQueued = false; refreshTree(); }
    });
  }

  // 別の作業でファイルを作ってこの画面に戻った時、自動で最新化する（スキャンが重いので3分に1回まで）
  window.addEventListener('focus', function () {
    if (Date.now() - lastRefreshAt > 180000) refreshTree();
  });

  // 「更新」ボタン：キャッシュを使わず再スキャン（fresh=1）。ツリーの再描画で完了が分かる
  reloadBtnEl.addEventListener('click', function () {
    load(true);
  });

  // git差分の表示（差分ボタン・ツリーの±ボタン共通）
  // ファイルならそのファイルだけ、フォルダならその配下だけの差分が返る
  function showDiff(p) {
    showFileTitle(p, '差分: ');
    var msg = document.getElementById('saveMsg');
    msg.style.color = '#888'; msg.textContent = '差分を取得中...';
    urlInput.value = p;
    updateClearBtn();
    placeholder.style.display = 'none';
    exitEdit();
    iframe.style.display = 'block';
    document.getElementById('editBtn').style.display = 'none';
    fetch('git_diff?p=' + encodeURIComponent(p) + '&t=' + Date.now())
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, t: t }; }); })
      .then(function (res) {
        iframe.removeAttribute('src');
        if (!res.ok) {
          var jp = res.t.indexOf('not a git repository') >= 0 ? 'gitリポジトリではありません' : res.t;
          iframe.srcdoc = markDoc(errHtml('差分を取得できません: ' + esc(jp)), p, '差分: ');
        } else {
          iframe.srcdoc = markDoc(diffHtml(res.t), p, '差分: ');
        }
        msg.textContent = '';
      })
      .catch(function () { msg.style.color = '#c00'; msg.textContent = '差分の取得に失敗しました'; });
  }
  // ===== 再表示（2026-09-02 追加） =====
  // 裏で書き換わったファイルを、ページ全体を読み込み直さずに反映する。
  // F5 だとツリーの開閉・スクロール・表示中ファイルがすべて消えてしまうため、
  // 開いているファイルだけ openFile で読み直す（各分岐が毎回キャッシュ回避で取り直す作り）。
  document.getElementById('reopenBtn').addEventListener('click', function () {
    var btn = this;
    var msg = document.getElementById('saveMsg');
    if (!currentWin) {
      msg.style.color = '#c00'; msg.textContent = '先にファイルを開いてから押してください';
      return;
    }
    // 編集中に読み直すと、保存していない変更が消えるので確認する
    if (editor.style.display !== 'none'
        && !confirm('編集中です。保存していない変更は失われます。再表示しますか？')) return;
    var menu = menuEl;
    var st = treeEl ? treeEl.scrollTop : 0;   // ツリーの見ていた位置を保つ
    openFile(currentWin);
    if (treeEl) treeEl.scrollTop = st;
    msg.textContent = '';
    btn.classList.add('done');            // 押したことが分かるように一瞬だけ色を変える
    setTimeout(function () { btn.classList.remove('done'); }, 600);
  });

  // ===== 開いているファイルが書き換わったら、本文を自動で読み直す（2026-10-24 本人指示。仕事１からの依頼） =====
  // 3秒ごとに api/stat で更新時刻と大きさを確かめ、変わったときだけ「再表示」と同じ読み直しをする。
  // タブが見えていない間・編集している間・差分を見ている間は、確かめも読み直しもしない。本文のスクロールの位置は保つ
  var AUTO_RELOAD_MS = 3000;
  var watchPath = '', watchSig = '';
  // 閲覧範囲から外したファイル。開き直すまで確かめない（2026-10-31。3秒ごとに断られ続けていた）。
  // 見つからない（404）ときは続ける。書き換えの途中で一瞬だけ無くなるファイルで、読み直しが止まらないように
  var watchGone = '';
  function checkOpenFileChanged() {
    if (document.hidden || !currentWin) return;
    if (editor.style.display !== 'none') return;   // 保存していない変更を消さない
    if (document.getElementById('fileTitleName').textContent.indexOf('差分: ') === 0) return;
    var p = currentWin;
    if (p === watchGone) return;
    fetch('api/stat?p=' + encodeURIComponent(p) + '&t=' + Date.now())
      .then(function (r) {
        if (r.status === 403) { watchGone = p; return null; }
        return r.ok ? r.json() : null;
      })
      .then(function (d) {
        if (!d || p !== currentWin) return;   // 待っている間に別のファイルを開いたら何もしない
        var sig = d.mtime + ':' + d.size;
        if (watchPath !== p) { watchPath = p; watchSig = sig; return; }   // 開いた直後の1回目は基準にするだけ
        if (sig === watchSig) return;
        watchSig = sig;
        reloadKeepingScroll(p);
      })
      .catch(function () {});
  }
  function reloadKeepingScroll(p) {
    var y = 0;
    try { y = iframe.contentWindow ? iframe.contentWindow.scrollY : 0; } catch (e) { y = 0; }
    if (y > 0) {
      var restore = function () {
        iframe.removeEventListener('load', restore);
        var put = function () { try { iframe.contentWindow.scrollTo(0, y); } catch (e) {} };
        put();
        setTimeout(put, 300);   // 図の描画などで、高さが後から変わる分も追いかける
      };
      iframe.addEventListener('load', restore);
      setTimeout(function () { iframe.removeEventListener('load', restore); }, 5000);   // 枠を使わない表示のときに残さない
    }
    var st = treeEl ? treeEl.scrollTop : 0;
    openFile(p);
    if (treeEl) treeEl.scrollTop = st;
    flashMsg('ファイルが書き換わったので読み直しました');
  }
  setInterval(checkOpenFileChanged, AUTO_RELOAD_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkOpenFileChanged(); });

  document.getElementById('diffBtn').addEventListener('click', function () {
    var p = normPath(urlInput.value);
    var msg = document.getElementById('saveMsg');
    if (!p || !isAbsPath(p)) {
      msg.style.color = '#c00'; msg.textContent = '差分を見たいフォルダかファイルの絶対パスを入れてから押してください';
      return;
    }
    showDiff(p);
  });

  // パスをコピー（記号ボタン）。押したことが分かるよう1秒だけ ✓ に変える
  document.getElementById('copyBtn').addEventListener('click', function () {
    var b = this;
    if (!urlInput.value) return;
    function flash(mark) {
      b.classList.add('copied'); b.textContent = mark;
      setTimeout(function () { b.classList.remove('copied'); b.textContent = '📋'; }, 1000);
    }
    copyText(urlInput.value).then(function () { flash('✓'); }).catch(function () { flash('!'); });
  });

  // ===== 絶対パスを入力して開く（Enter または「開く」ボタン） =====
  // エクスプローラーの「パスのコピー」で付く引用符や、/ 区切りのパスも受け付ける。
  function normPath(s) {
    s = (s || '').trim().replace(/^["']+|["']+$/g, '').trim();
    return s.replace(/\//g, '\\').replace(/\\+$/, '');
  }
  // 絶対パスかどうかの判定（ドライブ文字 or UNC）。相対パス・ファイル名は検索モードで扱う
  function isAbsPath(s) { return /^[a-zA-Z]:[\\\/]/.test(s) || /^\\\\/.test(s); }
  // 選んだ項目を、ツリー表示領域の一番上（上部に固定されたブックマーク欄のすぐ下）へ送る。
  // scrollIntoView({block:'start'}) だと、固定ヘッダーの裏に隠れてしまうため自前で計算する。
  function scrollTreeItemToTop(el) {
    if (!el || !treeEl) return;
    // ツリーが自分でスクロールするようになったので、ツリーの上端を基準にするだけでよい（2026-09-27）
    treeEl.scrollTop += el.getBoundingClientRect().top - treeEl.getBoundingClientRect().top - 4;
  }

  // ファイルを出したうえで、そのファイルが入っているフォルダの行をツリーの上の端にそろえる
  // （右クリックやパス欄の Enter で開いたとき。2026-10-14 本人指示。同じフォルダのほかのファイルも一緒に見えるように）。
  // フォルダの中が長くて開いたファイルが下にはみ出すときだけ、ファイルが下の端に見えるところまで戻す
  function revealInTreeFolderTop(winPath) {
    if (!revealInTree(winPath)) return false;
    var link = treeEl.querySelector('a.viewlink.active');
    var box = link && link.closest('.tree-folder-content');
    var row = box && box.previousElementSibling;
    if (!row || !row.classList.contains('tree-folder-name')) return true;   // 作業フォルダの直下のファイルはそのまま
    scrollTreeItemToTop(row);
    var over = link.getBoundingClientRect().bottom - treeEl.getBoundingClientRect().bottom + 4;
    if (over > 0) treeEl.scrollTop += over;
    updateTreeGuide();
    return true;
  }

  // ツリー内に同じファイルがあれば、強調表示して祖先フォルダを展開する。
  // 選んだ場所の階層も同じファイルに合わせる（2026-10-31）。quiet のときは合わせない（裏でツリーを読み直したとき）。
  // ツリーに出ないファイル（除外したフォルダの中、深すぎる場所、作りたてで読み直す前）が本文に開いているときは、
  // 前のファイルの印を外し、ツリーにあるいちばん近いフォルダまで開いて見せる（2026-11-03 本人指示。左のメニューを本文のファイルに合わせるため）
  function revealInTree(winPath, quiet) {
    var norm = winPath.toLowerCase();
    var links = treeEl.querySelectorAll('a.viewlink');
    for (var i = 0; i < links.length; i++) {
      var link = links[i];
      if ((link.dataset.win || '').replace(/\//g, '\\').toLowerCase() !== norm) continue;
      treeEl.querySelectorAll('a.viewlink.active').forEach(function (x) { x.classList.remove('active'); });
      link.classList.add('active');
      var p = link.parentElement;
      while (p && p !== treeEl) {
        if (p.classList.contains('tree-folder-content')) {
          p.style.display = 'block';
          var name = p.previousElementSibling;
          if (name && name.classList.contains('tree-folder-name')) { name.dataset.open = 'true'; addOpen(name.dataset.path); }
        }
        p = p.parentElement;
      }
      scrollTreeItemToTop(link);
      updateTreeGuide();
      if (!quiet) syncTopTree(link.dataset.win);
      return true;
    }
    if (!quiet && samePath(winPath, currentWin)) {
      treeEl.querySelectorAll('a.viewlink.active').forEach(function (x) { x.classList.remove('active'); });
      revealNearestFolder(winPath);
    }
    return false;
  }
  // ツリーにある、そのパスにいちばん近いフォルダまで開いて見せる（2026-11-03）
  function revealNearestFolder(winPath) {
    var d = dirName(String(winPath).replace(/\//g, '\\'));
    while (d && !nodeMap[d.toLowerCase()]) d = dirName(d);
    if (d) revealFolderInTree(nodeMap[d.toLowerCase()].path);
  }
  // ツリー内の同じフォルダを探し、祖先ごと展開して強調表示する（見つかれば true）。
  // 選んだ場所の階層は動かさない（2026-11-03 本人指示。階層はいつも本文で開いているファイルの道筋にする）
  function revealFolderInTree(winPath) {
    var norm = winPath.replace(/\//g, '\\').toLowerCase();
    var names = treeEl.querySelectorAll('.tree-folder-name');
    for (var i = 0; i < names.length; i++) {
      var f = names[i];
      if ((f.dataset.path || '').replace(/\//g, '\\').toLowerCase() !== norm) continue;
      // フォルダ自身を開く
      f.dataset.open = 'true';
      if (f.nextElementSibling) f.nextElementSibling.style.display = 'block';
      addOpen(f.dataset.path);
      // 祖先フォルダも全部開く
      var pnode = f.parentElement;
      while (pnode && pnode !== treeEl) {
        if (pnode.classList.contains('tree-folder-content')) {
          pnode.style.display = 'block';
          var nm = pnode.previousElementSibling;
          if (nm && nm.classList.contains('tree-folder-name')) { nm.dataset.open = 'true'; addOpen(nm.dataset.path); }
        }
        pnode = pnode.parentElement;
      }
      scrollTreeItemToTop(f);
      // どこに飛んだか分かるよう一瞬ハイライトする
      f.style.background = '#d6e4f5';
      (function (el) { setTimeout(function () { el.style.background = ''; }, 1500); })(f);
      return true;
    }
    return false;
  }
  // 閲覧範囲の外のパスを開こうとしたら、上のメッセージ欄に「閲覧範囲に追加」のボタンを出す（2026-10-31 本人指示）。
  // 押すと、そのフォルダ（ファイルなら入っているフォルダ）を読み取り専用でツリーの一番下に足し、そのまま開く
  function offerAddRoot(p) {
    var msg = document.getElementById('saveMsg');
    msg.style.color = '#c00';
    msg.textContent = '閲覧範囲の外です ';
    var b = document.createElement('button');
    b.textContent = '閲覧範囲に追加';
    b.title = '読み取り専用で、ツリーの一番下に加えます（ファイルのときは、入っているフォルダを加えます）';
    b.addEventListener('click', function () { addRoot(p); });
    msg.appendChild(b);
  }
  function addRoot(p) {
    var msg = document.getElementById('saveMsg');
    msg.style.color = '#888'; msg.textContent = '閲覧範囲に追加中...';
    var body = new URLSearchParams();
    body.append('p', p);
    fetch('api/add_root', { method: 'POST', headers: VIEWER_HDR, body: body })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, t: t }; }); })
      .then(function (res) {
        if (!res.ok) { msg.style.color = '#c00'; msg.textContent = res.t; return; }
        var info = JSON.parse(res.t);   // { path: 足したフォルダ, name: ツリーに出る名前, file: パスがファイルだったか }
        function show() { return info.file ? revealInTreeFolderTop(p) : revealFolderInTree(info.path); }
        refreshTree(function () {
          if (info.file) openFile(p);
          // 先に走っていた読み直し（足す前の中身）の後に呼ばれたときは、もう一度読み直してから出す
          if (!show()) refreshTree(show);
          addHistory(p);
          flashMsg('閲覧範囲に追加しました: ' + info.name);
        });
      })
      .catch(function () { flashMsg('閲覧範囲に追加できませんでした', '#c00'); });
  }
  function openFromInput() {
    var p = normPath(urlInput.value);
    if (!p) return;
    var msg = document.getElementById('saveMsg');
    // 絶対パス以外（ファイル名・相対パス）は検索として扱う
    if (!isAbsPath(p)) { showSearch(p); return; }
    // フォルダのパスなら、ツリー上で展開して見せる（すでにツリーにあれば即時）
    if (revealFolderInTree(p)) { addHistory(p); msg.textContent = ''; return; }
    msg.style.color = '#888'; msg.textContent = '確認中...';
    fetch(toUrl(p) + '&t=' + Date.now()).then(function (r) {
      if (r.ok) {
        if (r.body && r.body.cancel) { try { r.body.cancel(); } catch (e) {} }
        urlInput.value = p;
        openFile(p);
        // 作った直後のファイルはツリーにまだ無いことがある。見つからなければ裏で再スキャンして出す
        if (!revealInTreeFolderTop(p)) { pendingRevealPath = p; pendingSeq = scanSeq + 1; refreshTree(); }
        msg.textContent = '';
      } else {
        r.text().then(function (t) {
          // フォルダ指定（ツリーに未反映）なら、再スキャンしてから展開する
          if (t.indexOf('not a file') >= 0) {
            msg.style.color = '#888'; msg.textContent = 'フォルダをスキャン中...';
            refreshTree(function () {
              if (revealFolderInTree(p)) { addHistory(p); msg.textContent = ''; }
              else { msg.style.color = '#c00'; msg.textContent = '開けません: フォルダがツリーに見つかりません（除外対象の可能性）'; }
            });
            return;
          }
          if (t.indexOf('forbidden (outside allowed roots)') >= 0) { offerAddRoot(p); return; }
          var jp = 'パスを確認してください';
          if (t.indexOf('not found') >= 0) jp = 'ファイルが見つかりません';
          else if (t.indexOf('forbidden') >= 0) jp = '許可フォルダの外は開けません';
          msg.style.color = '#c00'; msg.textContent = '開けません: ' + jp;
        });
      }
    }).catch(function () {
      msg.style.color = '#c00'; msg.textContent = '開けません: サーバーに接続できません';
    });
  }
  // 「開く」ボタンは廃止。絶対パスを入力して Enter で開く。
  urlInput.addEventListener('keydown', function (e) {
    if (historyKeydown(e)) return;   // 履歴の選択操作（↑↓・Enter・Esc）を先に処理する
    if (e.key === 'Enter') { e.preventDefault(); hideHistory(); openFromInput(); }
  });

  // ===== 入力履歴（ファイル名が見える形で出す）＋ 入力欄のクリア =====
  // ブラウザ標準の履歴は長い絶対パスの末尾が切れて肝心のファイル名が見えないため、
  // autocomplete="off" で標準を止め、ファイル名を先頭に太字で出す自前の履歴に置き換える。
  var histEl = document.getElementById('urlHistory');
  var clearBtn = document.getElementById('urlClearBtn');
  var HIST_KEY = 'allViewerPathHistory';
  var HIST_MAX = 50;
  var histSel = -1;
  var suggestMode = 'history';  // 下に出ているリストの種類（history=履歴 / search=検索結果）
  var SEARCH_MAX = 100;         // 検索結果の表示上限

  function getHist() { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; } }
  function setHist(a) { try { localStorage.setItem(HIST_KEY, JSON.stringify(a.slice(0, HIST_MAX))); } catch (e) {} }
  function addHistory(p) {
    if (!p) return;
    var lp = p.toLowerCase();
    var a = getHist().filter(function (x) { return x.toLowerCase() !== lp; });
    a.unshift(p);
    setHist(a);
  }
  function rmHistory(p) {
    var lp = p.toLowerCase();
    setHist(getHist().filter(function (x) { return x.toLowerCase() !== lp; }));
  }
  function baseName(p) { var s = p.replace(/[\\/]+$/, ''); var i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/')); return i < 0 ? s : s.substring(i + 1); }
  function dirName(p) { var s = p.replace(/[\\/]+$/, ''); var i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/')); return i < 0 ? '' : s.substring(0, i); }
  // フォルダは末尾（深い階層）のほうが手がかりになるので、長い場合は先頭を省略する
  function shortDir(d) { return d.length > 64 ? '…' + d.substring(d.length - 64) : d; }

  function histRows() { return histEl.querySelectorAll('.uh-item'); }
  function hideHistory() { histEl.style.display = 'none'; histEl.innerHTML = ''; histSel = -1; }
  function showHistory(q) {
    suggestMode = 'history';
    var items = getHist();
    if (q) {
      var lq = q.toLowerCase();
      items = items.filter(function (p) { return p.toLowerCase().indexOf(lq) >= 0; });
    }
    if (!items.length) { hideHistory(); return; }
    var html = '<div class="uh-head">履歴（' + items.length + '件）　↑↓で選択・Enterで開く・×で削除</div>';
    items.forEach(function (p) {
      html += '<div class="uh-item" data-path="' + esc(p) + '" title="' + esc(p) + '">'
        + '<span class="uh-icon">' + iconOf(baseName(p), isDirPath(p)) + '</span>'
        + '<span class="uh-name">' + esc(baseName(p)) + '</span>'
        + '<span class="uh-dir">' + esc(shortDir(dirName(p))) + '</span>'
        + '<span class="uh-del" title="この履歴を削除">×</span>'
        + '</div>';
    });
    histEl.innerHTML = html;
    histEl.style.display = 'block';
    histSel = -1;
  }
  // ツリー全体からファイル名で検索して出す（スペース区切りはAND。名前一致を先頭、パス一致を後ろに）
  function showSearch(q) {
    suggestMode = 'search';
    // 区切りは \ に統一し、末尾の区切りは落とす（「00_黒板\郵便受け\」でフォルダ自身も一致させるため）
    var terms = q.toLowerCase().split(/\s+/).map(function (t) {
      return t.replace(/\//g, '\\').replace(/[\\]+$/, '');
    }).filter(function (t) { return t; });
    var nameHits = [], pathHits = [];
    for (var i = 0; i < flatIndex.length; i++) {
      var it = flatIndex[i];
      var pathL = it.path.toLowerCase();
      var ok = true;
      for (var j = 0; j < terms.length; j++) { if (pathL.indexOf(terms[j]) < 0) { ok = false; break; } }
      if (!ok) continue;
      var nameL = it.name.toLowerCase();
      var okName = true;
      for (j = 0; j < terms.length; j++) { if (nameL.indexOf(terms[j]) < 0) { okName = false; break; } }
      (okName ? nameHits : pathHits).push(it);
    }
    var items = nameHits.concat(pathHits);
    var total = items.length;
    if (!total) {
      // 名前で見つからないときこそ本文検索の出番なので、🔎行は必ず出す
      histEl.innerHTML = '<div class="uh-head">一致するファイルがありません</div>'
        + '<div class="uh-item uh-grep" data-grepq="' + esc(q) + '">'
        + '<span class="uh-icon">🔎</span>'
        + '<span class="uh-name">本文を検索</span>'
        + '<span class="uh-dir">ファイルの中身から「' + esc(q) + '」を探す</span>'
        + '</div>';
      histEl.style.display = 'block';
      histSel = -1;
      return;
    }
    items = items.slice(0, SEARCH_MAX);
    var head = total > SEARCH_MAX ? ('検索結果 上位' + SEARCH_MAX + '件を表示（全' + total + '件）') : ('検索結果（' + total + '件）');
    var html = '<div class="uh-head">' + head + '　↑↓で選択・Enterで開く</div>';
    items.forEach(function (it) {
      html += '<div class="uh-item" data-path="' + esc(it.path) + '" title="' + esc(it.path) + '">'
        + '<span class="uh-icon">' + iconOf(it.name, it.dir) + '</span>'
        + '<span class="uh-name">' + esc(it.name) + '</span>'
        + '<span class="uh-dir">' + esc(shortDir(dirName(it.path))) + '</span>'
        + '</div>';
    });
    html += '<div class="uh-item uh-grep" data-grepq="' + esc(q) + '">'
      + '<span class="uh-icon">🔎</span>'
      + '<span class="uh-name">本文を検索</span>'
      + '<span class="uh-dir">ファイルの中身から「' + esc(q) + '」を探す</span>'
      + '</div>';
    histEl.innerHTML = html;
    histEl.style.display = 'block';
    histSel = -1;
  }
  // 入力内容に応じて、履歴と検索結果のどちらを出すか決める
  function showSuggest() {
    var q = urlInput.value.trim();
    if (!q) { showHistory(''); return; }
    if (isAbsPath(q)) { showHistory(q); return; }
    showSearch(q);
  }
  function setHistSel(i) {
    var r = histRows();
    if (!r.length) return;
    if (i < 0) i = r.length - 1;
    if (i >= r.length) i = 0;
    r.forEach(function (x) { x.classList.remove('sel'); });
    r[i].classList.add('sel');
    r[i].scrollIntoView({ block: 'nearest' });
    histSel = i;
  }
  function chooseHistory(p) {
    urlInput.value = p;
    updateClearBtn();
    hideHistory();
    openFromInput();   // 存在確認つきで開く（移動・削除済みならメッセージが出る）
  }
  function historyKeydown(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (histEl.style.display === 'none') showSuggest();
      if (histEl.style.display === 'none') return false;
      setHistSel(e.key === 'ArrowDown' ? histSel + 1 : histSel - 1);
      e.preventDefault();
      return true;
    }
    if (e.key === 'Escape' && histEl.style.display !== 'none') { hideHistory(); return true; }
    if (e.key === 'Enter' && histEl.style.display !== 'none') {
      // 検索モードで未選択なら先頭候補を開く。履歴モードは明示選択時のみ
      var idx = (histSel >= 0) ? histSel : (suggestMode === 'search' ? 0 : -1);
      if (idx >= 0) {
        var row = histRows()[idx];
        if (row && row.dataset.grepq) { e.preventDefault(); runGrep(row.dataset.grepq); return true; }
        if (row && row.dataset.path) { e.preventDefault(); chooseHistory(row.dataset.path); return true; }
      }
    }
    return false;
  }

  histEl.addEventListener('mousedown', function (e) { e.preventDefault(); });  // 入力欄のフォーカスを外さない
  histEl.addEventListener('click', function (e) {
    var del = e.target.closest('.uh-del');
    if (del) {
      var row = del.closest('.uh-item');
      if (row) { rmHistory(row.dataset.path); showHistory(urlInput.value.trim()); }
      return;
    }
    var item = e.target.closest('.uh-item');
    if (!item) return;
    if (item.dataset.grepq) { runGrep(item.dataset.grepq); return; }
    if (item.dataset.path) chooseHistory(item.dataset.path);
  });
  // 入力欄に入った時点：空かパスなら履歴を全件出す（パスで絞ると1件しか出ず、切り替えに使えないため）。
  // 検索語が入っていれば検索結果を出す。
  function showOnFocus() {
    var q = urlInput.value.trim();
    if (!q || isAbsPath(q)) showHistory(''); else showSearch(q);
  }
  // クリックしたら中身を全選択する（そのまま貼り付けて差し替えられるように）。
  // 手で一部だけ選び直したい時は、選択操作が始まっている（=選択範囲がある）ので邪魔しない。
  function selectAllPath() {
    if (!urlInput.value) return;
    urlInput.select();
  }
  urlInput.addEventListener('focus', function () { showOnFocus(); selectAllPath(); });
  // すでにフォーカスがある状態で押し直した時は focus が起きないので、click でも処理する
  urlInput.addEventListener('click', function () {
    if (histEl.style.display === 'none') showOnFocus();
    if (urlInput.selectionStart === urlInput.selectionEnd) selectAllPath();
  });
  urlInput.addEventListener('input', function () { updateClearBtn(); showSuggest(); });
  urlInput.addEventListener('blur', function () { setTimeout(hideHistory, 150); });
  document.addEventListener('mousedown', function (e) {
    if (!e.target.closest('.url-wrap')) hideHistory();
  });

  function updateClearBtn() { clearBtn.style.display = urlInput.value ? 'block' : 'none'; }
  clearBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  clearBtn.addEventListener('click', function () {
    urlInput.value = '';
    updateClearBtn();
    urlInput.focus();
    showHistory('');   // クリア直後は履歴を全件出す
    document.getElementById('saveMsg').textContent = '';
  });
  updateClearBtn();

  // ファイル名で絞り込み：一致した項目と、その親フォルダだけを表示・展開する。
  function revealAll(container) {
    container.querySelectorAll('.tree-folder, .tree-file').forEach(function (n) { n.style.display = ''; });
    container.querySelectorAll('.tree-folder-content').forEach(function (c) { c.style.display = 'block'; });
    container.querySelectorAll('.tree-folder-name').forEach(function (f) { f.dataset.open = 'true'; });
  }
  function filterTree(container, q) {
    var any = false;
    container.querySelectorAll(':scope > .tree-folder, :scope > .tree-file').forEach(function (node) {
      if (node.classList.contains('tree-file')) {
        var a = node.querySelector('a');
        var hit = !!a && a.textContent.toLowerCase().indexOf(q) >= 0;
        node.style.display = hit ? '' : 'none';
        if (hit) any = true;
      } else {
        var labelEl = node.querySelector(':scope > .tree-folder-name > .tree-folder-label');
        var nameEl = node.querySelector(':scope > .tree-folder-name');
        var content = node.querySelector(':scope > .tree-folder-content');
        var nameHit = !!labelEl && labelEl.textContent.toLowerCase().indexOf(q) >= 0;
        var childHit = false;
        if (nameHit && content) { revealAll(content); childHit = true; }
        else if (content) { childHit = filterTree(content, q); }
        var show = nameHit || childHit;
        node.style.display = show ? '' : 'none';
        if (content) content.style.display = show ? 'block' : 'none';
        if (nameEl) nameEl.dataset.open = show ? 'true' : 'false';
        if (show) any = true;
      }
    });
    return any;
  }
  function restoreTreeDisplay() {
    treeEl.querySelectorAll('.tree-file, .tree-folder').forEach(function (el) { el.style.display = ''; });
    var open = getOpen();
    treeEl.querySelectorAll('.tree-folder-name').forEach(function (f) {
      var isOpen = open.indexOf(f.dataset.path) >= 0;
      f.dataset.open = isOpen ? 'true' : 'false';
      if (f.nextElementSibling) f.nextElementSibling.style.display = isOpen ? 'block' : 'none';
    });
  }
  // ===== 畳むボタン（2026-09-12 追加）：深さn以上のフォルダを一括で閉じる =====
  // 深さは「ルート直下のフォルダ＝1」。n=1で全部閉じ、n=2は第2階層から下を閉じる。
  // 開く方向には触らない（畳む専用）。閉じた状態は従来どおり記憶される。
  function collapseToDepth(n) {
    var changed = false;
    treeEl.querySelectorAll('.tree-folder-name').forEach(function (f) {
      var depth = 1;
      var p = f.parentElement;
      while (p && p !== treeEl) {
        if (p.classList.contains('tree-folder-content')) depth++;
        p = p.parentElement;
      }
      if (depth >= n && f.dataset.open === 'true') {
        f.dataset.open = 'false';
        if (f.nextElementSibling) f.nextElementSibling.style.display = 'none';
        rmOpen(f.dataset.path);
        changed = true;
      }
    });
    return changed;
  }
  document.querySelectorAll('.fold-btn').forEach(function (b) {
    b.addEventListener('click', function () { collapseToDepth(parseInt(this.dataset.depth, 10)); });
  });

  searchInputEl.addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    var grepBar = document.getElementById('treeGrep');
    if (!q) { restoreTreeDisplay(); grepBar.style.display = 'none'; return; }
    var any = filterTree(treeEl, q);
    // 名前で見つからなくても中身から探せるよう、絞り込み中は常に本文検索ボタンを出す
    var raw = this.value.trim();
    grepBar.textContent = '🔎 本文を検索「' + raw + '」' + (any ? '' : '（名前の一致なし）');
    grepBar.dataset.grepq = raw;
    grepBar.style.display = 'block';
  });
  document.getElementById('treeGrep').addEventListener('click', function () {
    if (this.dataset.grepq) runGrep(this.dataset.grepq);
  });

  // ===== ブックマーク（よく使うファイル・フォルダを、パス欄の下の帯に並べて一発で開く） =====
  // 置き場はファイル（api/bookmarks.json）。ブラウザ内（localStorage）だけだと、ブラウザのデータを
  // 消したときに一緒に消えたため、2026-10-04 にファイルへ移した（本人指示）。
  // 画面の処理は getBm() を同期で呼ぶので、localStorage は手元の写しとして残す。
  // 登録と解除は、ファイルの最新の中身に1件ずつ当てて書く（changeBm。2026-11-03 本人指示「消したブックマークが残る」）。
  // 前は手元の写しを丸ごと書き戻していたので、写しが古い画面で登録や解除をすると、ほかで消したものが戻っていた。
  // 写しは、起動時と、画面に戻ったときに、ファイルの中身で上書きする（loadBmFile）。
  // ツリーの全行（2万件超）にボタンを置くと重くなるため、登録は上部の★ボタンと右クリックで行い、
  // ツリー側は登録済みの行の c を後から黄色にする。
  var BM_KEY = 'allViewerBookmarks';

  function getBm() { try { return JSON.parse(localStorage.getItem(BM_KEY)) || []; } catch (e) { return []; } }
  function setLocalBm(a) { try { localStorage.setItem(BM_KEY, JSON.stringify(a)); } catch (e) {} }
  function refreshBmViews() { renderBookmarks(); markTreeBookmarks(); updateBmBtn(); }
  // 同じ場所かを比べる鍵。大文字と小文字、/ と \ 、末尾の \ の違いをそろえる
  function bmKey(p) { return String(p || '').replace(/\//g, '\\').replace(/\\+$/, '').toLowerCase(); }
  // ブックマークを変える。fn は並びを受け取り、変えた並びを返す。同じ変更を、手元の写しとファイルの最新の中身の両方に当てる。
  // 先に手元の写しで描いて待たせず、ファイルを読んでから同じ変更を当てて書く。ファイルを読めないときは手元の写しを書く
  function changeBm(fn) {
    var local = fn(getBm().slice());
    setLocalBm(local);
    refreshBmViews();
    fetch('api/bookmarks?t=' + Date.now())
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {

  function isBm(p) {

  // 置き場所を「作業フォルダの最上位から下」だけにして短くする

  function bmRelDir(p) {

  // ===== ブックマークの帯（2026-11-03 本人指示で作り、2026-11-04 本人指示でフォルダごとのボタンと一覧にした） =====
  // 帯には、ブックマークが入っている作業フォルダ直下のフォルダごとに、フォルダの印と件数のボタンを1つずつ並べ、帯の中で折り返して全部を出す。

  // 2026-11-04 に3段目で作ったが、28件が24個のボタンに分かれてばらばらに見えたので、同じ日に1段目にした（本人指示。会社のビューアの形）。
  // 作業フォルダの直下のファイルは、作業フォルダ自身を1つのボタンにする
  var BM_GROUP_DEPTH = 1;
  var bmGroups = [];     // ボタンの並び。{ path, name, node（一覧の木）, total, gone }
  var bmChipOfKey = {};  // パスの鍵 → ボタンの番号。ツリーの行に乗せたときに、光らせるボタンを引く
  var bmListKey = '';    // 開いている一覧のフォルダの鍵（閉じていれば空）

  function bmSegsOf(p) {
    var SEP = String.fromCharCode(92);
    var path = String(p).replace(/\//g, SEP).replace(/\\+$/, '');
    var lp = path.toLowerCase();
    var root = (treeRootPath || '').replace(/[\\\/]+$/, '');
    if (root && lp.indexOf(root.toLowerCase() + SEP) === 0) {
      return { base: root, segs: path.substring(root.length + 1).split(SEP) };

    var base = top ? dirName(top.path) : dirName(dirName(path));   // ツリーに無い場所は、すぐ上のフォルダを1段目にする

  }
  // ブックマークを BM_GROUP_DEPTH 段目のフォルダごとにまとめ、フォルダの中を一覧の木にする。ボタンの並びは、そのフォルダのものを初めて登録した順
  function bmBuildGroups(a) {
    var SEP = String.fromCharCode(92), groups = [], byKey = {};
    a.forEach(function (b) {
      var s = bmSegsOf(b.path);
      var isDir = !!b.dir || !!nodeMap[String(b.path).toLowerCase()];
      var folders = isDir ? s.segs : s.segs.slice(0, -1);
      var n = Math.min(BM_GROUP_DEPTH, folders.length);
      var gpath = n ? s.base + SEP + folders.slice(0, n).join(SEP) : s.base;
      var gk = bmKey(gpath), g = byKey[gk];
      if (!g) {
        g = byKey[gk] = { path: gpath, name: baseName(gpath), total: 0, gone: 0,

        groups.push(g);

      g.total++;
      if (bmIsGone(b)) g.gone++;
      var node = g.node, cur = gpath, rest = s.segs.slice(n);
      rest.forEach(function (name, i) {
        cur += SEP + name;
        var kid = node.kids.filter(function (k) { return k.name === name; })[0];
        if (!kid) {
          kid = { name: name, path: cur, dir: i < rest.length - 1 || isDir, kids: [], bm: null };
          node.kids.push(kid);
        }
        node = kid;
      });
      node.bm = b;
    });
    return groups;
  }
  // 一覧の行を作る。形はファイル名の帯の階段（renderDirSteps）と同じで、2段目から └ を付け、1段につき 1.3 文字下げる。
  // 同じ段の中は、フォルダを先に、名前の順に並べる
  function bmRowsHtml(node, depth) {

      + (depth ? '<span class="bm-row-mark">└ </span>' : '')
      + '<span class="bm-row-name">' + esc(node.name) + '</span></div>';

      if (x.dir !== y.dir) return x.dir ? -1 : 1;

  function closeBmList() {

  // 場所が見つからないブックマーク（消したか、移したもの）を確かめる（2026-11-03 本人指示）。
  // ツリーにあれば「ある」。ツリーに無いもの（深すぎる場所、除外したフォルダ、消したもの）だけサーバーに聞く。
  // ファイルは api/stat で聞く（中身を読まない）。そこで見つからなければ serve に聞き、「not a file」ならフォルダとしてある。

  var bmGone = {};       // 鍵 → true（無い）／false（ある）

  function checkBms(force) {

    function isHidden(el) {
      if (!el || el.nodeType !== 1) return false;
      if (hidden.has(el)) return hidden.get(el);
      var r = !!SKIP[el.tagName.toUpperCase()] || win.getComputedStyle(el).display === 'none' || isHidden(el.parentElement);
      hidden.set(el, r);
      return r;
    }
    var walker = doc.createTreeWalker(doc.body || doc.documentElement, 4);   // 4 は NodeFilter.SHOW_TEXT（テキストノードだけを見る）
    var nodes = [], starts = [], parts = [], pos = 0, n;
    while ((n = walker.nextNode())) {
      if (!n.data || isHidden(n.parentElement)) continue;
      nodes.push(n); starts.push(pos); parts.push(n.data);
      pos += n.data.length;
    }
    return { nodes: nodes, starts: starts, text: parts.join('') };
  }
  // つないだ文字列の中の位置から、何番目のテキストノードかを引く
  function findNodeIndexAt(starts, off) {
    var lo = 0, hi = starts.length - 1;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (starts[mid] <= off) lo = mid; else hi = mid - 1;
    }
    return lo;
  }
  // 色の指定を本文の文書に1回だけ入れる
  function findEnsureStyle(doc) {
    if (doc.getElementById('hhFindStyle')) return;
    var st = doc.createElement('style');
    st.id = 'hhFindStyle';
    st.textContent = '::highlight(hhfind){background-color:#ffeb3b;color:#000;}'
      + '::highlight(hhfindcur){background-color:#ff9800;color:#000;}';
    (doc.head || doc.documentElement).appendChild(st);
  }
  function findClearPaint() {
    try {
      var hl = iframe.contentWindow.CSS.highlights;
      hl.delete('hhfind');
      hl.delete('hhfindcur');
    } catch (e) {}
  }
  function findPaintAll(doc, win) {
    if (!win.CSS || !win.CSS.highlights || !win.Highlight) return;
    findEnsureStyle(doc);
    var all = new win.Highlight();
    findRanges.forEach(function (r) { all.add(r); });
    win.CSS.highlights.set('hhfind', all);
  }
  function findPaintCurrent(win) {
    if (!win.CSS || !win.CSS.highlights || !win.Highlight) return;
    win.CSS.highlights.delete('hhfindcur');
    if (findIndex < 0 || !findRanges[findIndex]) return;
    var cur = new win.Highlight(findRanges[findIndex]);
    cur.priority = 1;   // 黄色より上に重ねる
    win.CSS.highlights.set('hhfindcur', cur);
  }
  function findShowCount() {
    var none = !findRanges.length && !!findInputEl.value.trim();
    findCountEl.classList.toggle('none', none);
    findCountEl.textContent = findRanges.length
      ? (findIndex + 1) + ' / ' + findRanges.length + (findCapped ? '+' : '')
      : (none ? '0 件' : '');
  }
  // 欄の文字で探し直す。keep のときは、同じファイルの読み直しなので、見ていた位置を動かさない
  function runFind(keep) {
    clearTimeout(findTimer);
    findTimer = 0;
    var doc = findDoc(), win = doc && iframe.contentWindow;
    var prev = findIndex;
    findRanges = []; findIndex = -1; findCapped = false;
    findClearPaint();
    findPath = currentWin;
    var re = findPattern(findInputEl.value);
    if (!doc || !win || !re) { findShowCount(); return; }
    var c = findCollect(doc, win), m;
    if (c.nodes.length) {
      while ((m = re.exec(c.text))) {
        if (findRanges.length >= FIND_MAX) { findCapped = true; break; }
        var end = m.index + m[0].length;
        var a = findNodeIndexAt(c.starts, m.index), b = findNodeIndexAt(c.starts, end - 1);
        var r = doc.createRange();
        r.setStart(c.nodes[a], m.index - c.starts[a]);
        r.setEnd(c.nodes[b], end - c.starts[b]);
        findRanges.push(r);
      }
    }
    findPaintAll(doc, win);
    if (!findRanges.length) { findShowCount(); return; }
    if (keep) {
      findIndex = Math.min(Math.max(prev, 0), findRanges.length - 1);
      findPaintCurrent(win);
      findShowCount();
      return;
    }
    findGo(0);
  }
  // i 件目へ移る。端まで行ったら反対の端へ回る
  function findGo(i) {
    var doc = findDoc(), win = doc && iframe.contentWindow;
    if (!win || !findRanges.length) { findShowCount(); return; }
    findIndex = (i + findRanges.length) % findRanges.length;
    findPaintCurrent(win);
    findShowCount();
    var r = findRanges[findIndex], el = r.startContainer.parentElement;
    // 畳んである <details> の中なら開く。閉じたままだと位置が無く、送れないため
    for (var d = el; d; d = d.parentElement) {
      if (d.tagName && d.tagName.toUpperCase() === 'DETAILS' && !d.open) d.open = true;
    }
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', inline: 'nearest' });
    // 長い段落では、段落を真ん中に送っても文字が画面の外に残るので、文字の位置で送り直す
    var rc = r.getBoundingClientRect();
    if (rc.height && (rc.top < 0 || rc.bottom > win.innerHeight)) win.scrollBy(0, rc.top - win.innerHeight / 2);
  }
  function findStep(dir) {
    if (findTimer) { runFind(); return; }   // 欄の文字を変えた直後は、先に探し直す
    if (!findRanges.length) { runFind(); return; }
    findGo(findIndex + dir);
  }
  function closeFind() {
    clearTimeout(findTimer);
    findTimer = 0;
    findBarEl.style.display = 'none';
    findClearPaint();
    findRanges = []; findIndex = -1; findCapped = false;
    try { if (iframe.style.display !== 'none') iframe.contentWindow.focus(); } catch (e) {}
  }
  function findSchedule() {
    clearTimeout(findTimer);
    findTimer = setTimeout(function () { runFind(); }, 200);
  }
  findInputEl.addEventListener('keydown', function (e) {
    if (e.isComposing) return;   // 日本語を変換している間の Enter は確定なので、次へ移らない
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); findStep(e.shiftKey ? -1 : 1); return; }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeFind(); }
  });
  findInputEl.addEventListener('input', function (e) { if (!e.isComposing) findSchedule(); });
  findInputEl.addEventListener('compositionend', findSchedule);
  document.getElementById('findClose').addEventListener('click', closeFind);
  // 本文を読み直したとき（別のファイルを開いた、書き換わって自動で読み直した）も、欄を開いていれば探し直す。同じファイルなら位置は動かさない
  iframe.addEventListener('load', function () { if (isFindOpen()) runFind(samePath(currentWin, findPath)); });
  document.getElementById('outlinePane').addEventListener('click', function (e) {
    var item = e.target.closest('.ol-item');
    if (!item) return;
    var h = outlineTargets[parseInt(item.dataset.i, 10)];
    if (h && h.scrollIntoView) h.scrollIntoView({ block: 'start' });
  });
  function toggleOutline() {
    try { localStorage.setItem(OUTLINE_KEY, outlineHidden() ? '0' : '1'); } catch (e) {}
    applyOutlineVisibility();
  }
  document.getElementById('outlineBtn').addEventListener('click', toggleOutline);
  // F1 で目次の表示／非表示（2026-09-19 追加・本人指定のキー）。
  // ブラウザ既定のヘルプ表示を preventDefault で止める。目次が無いファイルでは何もしない
  document.addEventListener('keydown', function (e) {
    if (e.key === 'F1' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) {
      e.preventDefault();
      if (outlineTargets.length > 0) toggleOutline();
    }
  });

  // ===== 全文検索（本文検索）。索引方式：api/fts =====
  // 入り口は左メニューの専用欄（#grepInput・Enterで実行）。ファイル名検索とは完全に別扱い。
  // 結果は左の専用パネル（#grepPanel）に「ファイル名＋場所＋ヒット行」で一覧し、クリックで開く。
  var grepPanelEl = document.getElementById('grepPanel');
  var grepListEl = document.getElementById('grepList');
  var grepHeadEl = document.getElementById('grepHead');

  function grepMsg(text) {
    grepPanelEl.style.display = 'block';
    grepHeadEl.textContent = text;
    grepListEl.innerHTML = '';
  }

  function renderGrepPanel(d) {
    grepPanelEl.style.display = 'block';
    grepHeadEl.textContent = '「' + d.q + '」 一致 ' + d.hits.length + '件'
      + (d.truncated ? '（多すぎるため一部のみ）' : '');
    var html = '';
    d.hits.forEach(function (h) {
      html += '<div class="grep-item" data-path="' + esc(h.path) + '" title="' + esc(h.path) + '">'
        + '<div class="gname">' + iconOf(baseName(h.path), false) + ' ' + esc(baseName(h.path)) + '</div>'
        + '<div class="gdir">' + esc(bmRelDir(h.path)) + '</div>'
        + '<div class="gtext">' + h.line + '行目: ' + esc(h.text) + '</div>'
        + '</div>';
    });
    grepListEl.innerHTML = html || '<div class="grep-item">一致するファイルはありません</div>';
  }

  function runGrepBuild(q) {
    fetch('api/fts?op=build&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.remaining > 0) {
          grepMsg('索引を作成中… 残り ' + d.remaining + ' ファイル（初回だけ時間がかかります）');
          runGrepBuild(q);
        } else {
          runGrepPanel(q);
        }
      })
      .catch(function () { grepMsg('索引の作成に失敗しました'); });
  }

  // 検索を速く保つため、索引の鮮度合わせ（フォルダ走査）は裏で静かに行う。
  // 検索のたびに1回だけ起動し、残りが無くなるまで回す（画面には出さない）。
  var grepBgBusy = false;
  function grepBgRefresh() {
    if (grepBgBusy) return;
    grepBgBusy = true;
    (function step(rounds) {
      fetch('api/fts?op=build&t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.remaining > 0 && rounds < 30) step(rounds + 1);
          else grepBgBusy = false;
        })
        .catch(function () { grepBgBusy = false; });
    })(0);
  }

  function runGrepPanel(q) {
    q = (q || '').trim();
    if (q.length < 2) { grepMsg('2文字以上で検索してください'); return; }
    document.getElementById('grepInput').value = q;
    hideHistory();   // 上の候補リストから来た場合は閉じる
    grepMsg('「' + q + '」を検索中…');
    fetch('api/fts?op=search&q=' + encodeURIComponent(q) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.need_build) { runGrepBuild(q); return; }
        if (d.error) { grepMsg('検索できません: ' + d.error); return; }
        renderGrepPanel(d);
        grepBgRefresh();
      })
      .catch(function () { grepMsg('本文検索に失敗しました'); });
  }
  var runGrep = runGrepPanel;   // 旧呼び出し名の互換（候補リストの🔎・絞り込み欄下のボタンも同じ結果パネルに出す）

  document.getElementById('grepInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); runGrepPanel(this.value); }
    if (e.key === 'Escape') { grepPanelEl.style.display = 'none'; }
  });
  document.getElementById('grepClose').addEventListener('click', function () {
    grepPanelEl.style.display = 'none';
    grepListEl.innerHTML = '';
  });
  grepListEl.addEventListener('click', function (e) {
    var item = e.target.closest('.grep-item');
    if (item && item.dataset.path) openFile(item.dataset.path);
  });

  // ===== 編集機能 =====
  function exitEdit() {
    editor.style.display = 'none';
    document.getElementById('saveBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('editBtn').style.display = (EDIT_EXT.indexOf(extOf(currentWin)) >= 0 && currentWin) ? '' : 'none';
    document.getElementById('saveMsg').textContent = '';
  }
  document.getElementById('editBtn').addEventListener('click', function () {
    if (!currentWin) return;
    // 元の生テキストを取得して textarea に入れる
    fetch(toUrl(currentWin) + '&t=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
      editor.value = t;
      iframe.style.display = 'none';
      document.getElementById('outlinePane').style.display = 'none';
      document.getElementById('outlineBtn').style.display = 'none';
      editor.style.display = 'block';
      document.getElementById('editBtn').style.display = 'none';
      document.getElementById('saveBtn').style.display = '';
      document.getElementById('cancelBtn').style.display = '';
    });
  });
  document.getElementById('cancelBtn').addEventListener('click', function () {
    exitEdit();
    openFile(currentWin); // 閲覧に戻す
  });
  document.getElementById('saveBtn').addEventListener('click', function () {
    if (!currentWin) return;
    var msg = document.getElementById('saveMsg');
    msg.style.color = '#888'; msg.textContent = '保存中...';
    var body = new URLSearchParams();
    body.append('p', currentWin);
    body.append('body', editor.value);
    fetch('save', { method: 'POST', headers: VIEWER_HDR, body: body })
      .then(function (r) { return r.text().then(function(t){ return {ok:r.ok, t:t}; }); })
      .then(function (res) {
        if (res.ok) { msg.style.color = '#178a3a'; msg.textContent = '保存しました (' + res.t + ')'; }
        else { msg.style.color = '#c00'; msg.textContent = '保存失敗: ' + res.t; }
      })
      .catch(function (e) { msg.style.color = '#c00'; msg.textContent = '保存失敗: ' + e; });
  });

  // ===== メニューの大きさをドラッグで変更（左＝幅・下＝高さ。どちらも記憶する） =====
  (function () {
    var menu = document.querySelector('.menu');
    var dragbar = document.getElementById('dragbar');
    var iframe = document.getElementById('viewer');
    function clamp(w) { w = parseInt(w, 10); if (isNaN(w)) return 520; if (w < 150) w = 150; if (w > 1400) w = 1400; return w; }
    menu.style.width = clamp(localStorage.getItem('allViewerMenuWidth') || 520) + 'px';
    if (!dragbar) return;
    var dragging = false;
    function stop() {
      if (!dragging) return;
      dragging = false;
      dragbar.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      if (iframe) iframe.style.pointerEvents = '';
      if (currentMenuMode === 'bottom') {
        var h = parseInt(menu.style.height, 10);
        if (!isNaN(h)) localStorage.setItem('allViewerMenuHeight', h);
      } else {
        var w = parseInt(menu.style.width, 10);
        if (!isNaN(w)) localStorage.setItem('allViewerMenuWidth', w);
      }
    }
    dragbar.addEventListener('mousedown', function (e) {
      dragging = true;
      dragbar.classList.add('dragging');
      document.body.style.cursor = (currentMenuMode === 'bottom') ? 'row-resize' : 'col-resize';
      document.body.style.userSelect = 'none';
      if (iframe) iframe.style.pointerEvents = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      if (e.buttons === 0) { stop(); return; }
      if (currentMenuMode === 'bottom') {
        menu.style.height = clampMenuHeight(window.innerHeight - e.clientY) + 'px';
      } else {
        menu.style.width = clamp(e.clientX - menu.getBoundingClientRect().left) + 'px';
      }
    });
    document.addEventListener('mouseup', stop);
    window.addEventListener('blur', stop);
  })();

  // 下モードのメニュー高さの範囲（画面を全部覆わないよう上限を付ける）
  function clampMenuHeight(h) {
    h = parseInt(h, 10);
    if (isNaN(h)) h = 320;
    var max = window.innerHeight - 120;
    if (h < 100) h = 100;
    if (h > max) h = max;
    return h;
  }

  // ===== メニューの置き場所（左 / 下）。状態は記憶する =====
  (function () {
    var container = document.querySelector('.container');
    var bBtn = document.getElementById('modeBottomBtn');
    var KEY = 'allViewerMenuMode';
    if (!container || !bBtn) return;

    function apply(mode) {
      currentMenuMode = mode;
      container.classList.toggle('mode-bottom', mode === 'bottom');
      bBtn.classList.toggle('active', mode === 'bottom');
      // 下のときだけ高さを持たせる（左は指定しない＝CSSに任せる）
      menuEl.style.height = (mode === 'bottom')
        ? clampMenuHeight(localStorage.getItem('allViewerMenuHeight') || 320) + 'px'
        : '';
    }
    var saved = 'left';
    try { saved = localStorage.getItem(KEY) || 'left'; } catch (e) {}
    apply(saved === 'bottom' ? 'bottom' : 'left');

    // 同じボタンをもう一度押すと左（既定）に戻る
    bBtn.addEventListener('click', function () {
      var mode = (currentMenuMode === 'bottom') ? 'left' : 'bottom';
      apply(mode);
      try { localStorage.setItem(KEY, mode); } catch (e) {}
    });
  })();

  // ===== メニューを別ウィンドウへ切り離す（操作パネルとして独立させる） =====
  // ツリーを作り直すのではなく、メニューの要素そのものを別ウィンドウへ移す。
  // こうすると読み込み済みのツリー・検索索引・イベントがそのまま生き、
  // 別窓でファイルを選ぶと本体側のビューアに表示される。
  (function () {
    var container = document.querySelector('.container');
    var btn = document.getElementById('modePopupBtn');
    if (!container || !btn) return;
    var win = null;         // 切り離し先のウィンドウ
    var slot = null;        // 戻す位置の目印
    var watcher = null;     // 手で閉じられたのを検知する

    function detach() {
      var w = parseInt(menuEl.style.width, 10) || 520;
      win = window.open('', 'hatohatoscopeMenu', 'width=' + (w + 60) + ',height=900,left=60,top=60');
      if (!win) {
        var msg = document.getElementById('saveMsg');
        msg.style.color = '#c00';
        msg.textContent = '別窓を開けませんでした（ブラウザのポップアップ許可が必要です）';
        return;
      }
      // 本体と同じ見た目にするため、スタイルをそのまま複製して渡す
      var css = '';
      var st = document.querySelector('style');
      if (st) css = st.textContent;
      win.document.head.innerHTML = '<meta charset="UTF-8"><title>hatohatoscope — メニュー</title>'
        + '<style>' + css + 'body{margin:0;background:#f7f7f7;}'
        + '.menu{width:auto !important;height:100vh !important;max-width:none;}</style>';
      win.document.body.innerHTML = '';
      // 戻す位置に目印を置いてから、メニュー本体ごと移す
      slot = document.createComment('menu-slot');
      menuEl.parentNode.insertBefore(slot, menuEl);
      menuEl.classList.remove('collapsed');   // 隠した状態のまま移すと別窓が空になる
      win.document.body.appendChild(win.document.adoptNode(menuEl));
      container.classList.add('mode-detached');
      btn.classList.add('active');
      // ★別窓が閉じられる「前」に本体へ戻す。
      // 閉じ切ってから戻すと、破棄された文書と一緒にクリック等のイベントが失われ、
      // 見た目は戻っているのに検索もクリックも効かないメニューになる（2026-08-22 実測）。
      win.addEventListener('beforeunload', function () { redock(); });
      // 上が働かなかったときの保険。ここに来た場合はイベントが死んでいるので読み直す
      watcher = setInterval(function () {
        if (!win || win.closed) {
          var lost = (menuEl.ownerDocument !== document);
          redock();
          if (lost) location.reload();
        }
      }, 500);
      win.focus();
    }

    function redock() {
      if (watcher) { clearInterval(watcher); watcher = null; }
      if (menuEl.ownerDocument !== document) {
        document.adoptNode(menuEl);
        if (slot && slot.parentNode) {
          slot.parentNode.insertBefore(menuEl, slot);
          slot.parentNode.removeChild(slot);
        } else {
          container.insertBefore(menuEl, container.firstChild);
        }
      }
      slot = null;
      container.classList.remove('mode-detached');
      btn.classList.remove('active');
      if (win && !win.closed) { try { win.close(); } catch (e) {} }
      win = null;
    }

    btn.addEventListener('click', function () {
      if (win && !win.closed) redock(); else detach();
    });
    // 本体を閉じる・再読込するときは、取り残しになる別窓も閉じる
    window.addEventListener('beforeunload', function () {
      if (win && !win.closed) { try { win.close(); } catch (e) {} }
    });
  })();

  // ===== 左メニューの表示 / 非表示（状態は記憶する） =====
  (function () {
    var menu = document.querySelector('.menu');
    var dragbar = document.getElementById('dragbar');
    var btn = document.getElementById('toggleMenuBtn');
    var tab = document.getElementById('menuTab');   // 境目のつまみ（2026-11-03 本人指示）
    var KEY = 'allViewerMenuHidden';
    if (!menu || !btn) return;

    function apply(hidden) {
      menu.classList.toggle('collapsed', hidden);
      if (dragbar) dragbar.classList.toggle('collapsed', hidden);
      // 隠しても幅の設定は残るので、表示に戻すと元の幅に復帰する
      btn.textContent = hidden ? '▶' : '◀';
      btn.title = (hidden ? '左メニューを表示する' : '左メニューを隠す') + '（Ctrl+B）';
      if (tab) {
        tab.textContent = hidden ? 'メニュー表示' : 'メニュー非表示';
        tab.title = btn.title;
      }
      if (titlePath) layoutFileTitle(titlePath);   // 帯の階段は、メニューを隠している間だけ出す（2026-11-04 本人指示）
    }
    function set(hidden) {
      apply(hidden);
      try { localStorage.setItem(KEY, hidden ? '1' : '0'); } catch (e) {}
    }
    function isHidden() { return menu.classList.contains('collapsed'); }

    var saved = '0';
    try { saved = localStorage.getItem(KEY) || '0'; } catch (e) {}
    apply(saved === '1');

    btn.addEventListener('click', function () { set(!isHidden()); });
    if (tab) tab.addEventListener('click', function () { set(!isHidden()); });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'b' || e.key === 'B')) {
        e.preventDefault();
        set(!isHidden());
      }
    });
  })();

  // ===== 最大化（2026-10-07 本人指示） =====
  // 表示中のファイルだけを画面いっぱいに出す。左のメニュー・パス欄・ファイル名の帯・目次は CSS（body.maximized）で隠す。
  // 戻すのは右上の「元に戻す」か Esc。Esc はふだん「ビューアごと読み直す」なので、最大化の間だけ戻す方を先に効かせる
  // （下の Esc の処理の先頭を参照）。読み直したときは最大化しない状態で開く（記憶しない）
  function isMaximized() { return document.body.classList.contains('maximized'); }
  function setMaximized(on) {
    document.body.classList.toggle('maximized', !!on);
  }
  document.getElementById('maxBtn').addEventListener('click', function () { setMaximized(true); });
  document.getElementById('restoreBtn').addEventListener('click', function () { setMaximized(false); });

  // URLで直接ファイルを開く: all.html?open=<Windowsフルパス(encodeURIComponent)>
  (function () {
    var m = location.search.match(/[?&]open=([^&]+)/);
    if (m) {
      try {
        var p = normPath(decodeURIComponent(m[1]));
        openFile(p);
        revealInTree(p);   // この時点ではツリー未読込で空振りするが、load() 完了後に合わせ直す
      } catch (e) {}
    }
  })();

  // Esc でビューアごと読み直す（2026-09-27 本人指示。Ctrl+F5 と同じことを1キーで）。
  // URL に時刻を足して開き直すので、ブラウザの控えではなく all.html を取り直す。
  // すでに Esc を使っている動き（メニュー・パス欄の履歴・本文検索の結果・編集中）があるときは何もしない
  function hardReloadViewer() {
    var q = '?t=' + Date.now() + (currentWin ? '&open=' + encodeURIComponent(currentWin) : '');
    location.replace(location.pathname + q);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (!ctxCleanup && bmListKey) { closeBmList(); return; }           // ブックマークの一覧が開いている
    if (!ctxCleanup && isFindOpen()) { closeFind(); return; }          // 本文の中を探す欄が開いている
    if (isMaximized()) { setMaximized(false); return; }                // 最大化の間は、読み直さずに元の画面に戻す
    if (ctxCleanup) return;                                            // 右クリックのメニューが開いている
    if (histEl && histEl.style.display !== 'none') return;             // パス欄の履歴が開いている
    if (grepPanelEl && grepPanelEl.style.display !== 'none') return;   // 本文検索の結果が開いている
    if (editor && editor.style.display !== 'none') return;             // 編集中
    var t = e.target, tag = (t && t.tagName) ? t.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea') return;
    hardReloadViewer();
  });

  // 行までの階層を、待ち時間なしで出す吹き出し（2026-09-27 本人指示で作成）。
  // 名前だけ（9/27）→ 絶対パス（10/14）→ 1階層1行の階段（10/18 本人指示）と変えてきた。
  // 階段の形は、ファイル名の下の場所の表示（renderDirSteps）と同じ。最後の行がその行のファイル名かフォルダ名
  var tipEl = document.getElementById('hoverTip');
  var tipRow = null;
  function tipRowOf(t) {
    if (!t || !t.closest) return null;
    return t.closest('.tree-file, .tree-folder-name, .bm-chip');
  }
  function tipTextOf(row) {
    // 行の頭の c（パスのコピー）が絶対パスを持っている。無い行は行そのものの data-path、それも無ければ名前
    var c = row.querySelector('.tree-c-copy');
    var p = (c && c.dataset.path) || row.dataset.path || '';
    if (p) return p.replace(/\//g, '\\');
    var el = row.querySelector('.tree-folder-label, .bm-dir-name, .bm-name, a');
    return el ? el.textContent.trim() : '';
  }
  // 吹き出しの中身を階段で組み立てる。作業フォルダの中は作業フォルダより下だけ、外はドライブから出す
  function renderTipSteps(box, text) {
    box.textContent = '';
    if (text.indexOf('\\') < 0) { box.textContent = text; return; }   // パスでない（名前だけ）ときはそのまま
    var root = (treeRootPath || '').replace(/[\\/]+$/, '');
    var rel = (root && text.toLowerCase().indexOf(root.toLowerCase() + '\\') === 0) ? text.substring(root.length + 1) : text;
    var parts = rel.split(/[\\\/]+/).filter(function (s) { return s; });
    parts.forEach(function (name, i) {
      var line = document.createElement('div');
      line.style.paddingLeft = (Math.max(0, i - 1) * 1.3) + 'em';
      line.textContent = (i === 0 ? '' : '└ ') + name;
      box.appendChild(line);
    });
  }
  function hideTip() { tipRow = null; if (tipEl) tipEl.style.display = 'none'; }
  document.addEventListener('mouseover', function (e) {
    var row = tipRowOf(e.target);
    if (row === tipRow) return;
    tipRow = row;
    if (!row || !tipEl) { if (tipEl) tipEl.style.display = 'none'; return; }
    var text = tipTextOf(row);
    if (!text) { tipEl.style.display = 'none'; return; }
    renderTipSteps(tipEl, text);
    tipEl.style.display = 'block';
    // 行のすぐ下に出す。画面からはみ出すときは内側へ寄せる
    var r = row.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var left = Math.min(r.left + 16, window.innerWidth - w - 8);
    var top = (r.bottom + 4 + h > window.innerHeight) ? (r.top - h - 4) : (r.bottom + 4);
    tipEl.style.left = Math.max(4, left) + 'px';
    tipEl.style.top = Math.max(4, top) + 'px';
  });
  document.addEventListener('mouseleave', hideTip);
  document.addEventListener('mousedown', hideTip);
  window.addEventListener('scroll', hideTip, true);   // ツリーやブックマーク欄を動かしたら消す

  load();
})();
</script>
</body>
</html>
